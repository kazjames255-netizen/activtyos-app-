h1{font-size:26px;font-weight:800;margin:0 0 4px}.sub{color:#8B97BC;font-size:14px;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px}

.new{margin-left:auto;font-size:9.5px;font-weight:800;background:#FF3D7F;color:#fff;border-radius:999px;padding:4px 9px}
