<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f8fd;color:#171534;font-family:'Helvetica Neue','Segoe UI',system-ui,Arial,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:40px 24px 80px}
h1{font-size:26px;font-weight:800;margin:0 0 4px}
.sub{color:#8a86a3;font-size:14px;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px}
@media(min-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
.tile{margin:0;background:#0d1430;border:1px solid #ece6f1;border-radius:20px;padding:18px;overflow:hidden}
.stage{position:relative;height:300px}
.mini{position:absolute;right:0;top:18px;width:330px;background:#ffffff;border:1px solid rgba(143,169,251,.18);border-radius:16px;overflow:hidden;box-shadow:0 24px 50px -24px #000;z-index:1}

.dot{width:8px;height:8px;border-radius:50%;background:#2f6bd8}.dot.g{background:rgba(255,255,255,.18)}
.new{margin-left:auto;font-size:10px;font-weight:800;background:#2f6bd8;color:#fff;border-radius:999px;padding:4px 9px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px}
.th{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;flex:none}
.ri{flex:1;min-width:0;display:flex;flex-direction:column}
.ri b{font-size:12.5px;font-weight:800}.ri i{font-size:10.5px;color:#8a86a3;font-style:normal}
.pl{font-size:10px;font-weight:800;border-radius:999px;padding:4px 9px}
.pl.live{background:#e7f6ee;color:#0b6b4f}.pl.wait{background:rgba(245,185,74,.16);color:#f5b81f}
.ph{position:absolute;left:8px;top:26px;width:250px;z-index:2;transform:rotate(-3deg)}
.pic{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 56px -20px rgba(0,0,0,.85)}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.pic .duo{position:absolute;inset:0;background:linear-gradient(150deg,rgba(8,11,30,.30),rgba(255,61,127,.42) 92%);mix-blend-mode:overlay}
.pic .seam{position:absolute;top:6%;right:-6px;bottom:6%;width:18px;border-radius:20px;background:linear-gradient(90deg,transparent,rgba(255,61,127,.85));filter:blur(8px)}

figcaption{margin-top:14px}

figcaption span{font-size:12.5px;color:#8a86a3}
