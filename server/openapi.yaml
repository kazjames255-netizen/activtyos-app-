openapi: 3.0.3
info:
  title: ActivityOS API
  version: 0.31.0
  description: |
    Express + Firestore backend for ActivityOS — a **multi-tenant** platform
    for children's activity providers.

    ## v0.31.0 — Cross-provider marketplace (opt-in)

    The parent Browse feed becomes a real marketplace instead of being scoped
    (client-side) to providers a family had already booked.
    - **`GET /api/listings`** (no `?tenantId=`, no `?mine=1`) now returns the
      live/public/unarchived listings of every provider **that has opted in**
      (`settings.marketplaceListed === true`) — **plus**, for a signed-in
      parent, their own providers (anyone they've booked) regardless of opt-in.
    - A provider's **own storefront** (`GET /api/listings?tenantId=`) is
      unchanged — their public listings always show there whether or not
      they're in the marketplace.
    - New tenant setting **`marketplaceListed`** (in the library `settings`
      bag), default **false** — a provider opts in from Setup → Bookings →
      Marketplace. Opt-in is a deliberate choice; nobody is publicly listed
      without it.
    (Frontend: BrowseApp drops the old single-provider scoping and shows the
    server feed as-is.)

    ## v0.30.0 — Account, Data & privacy, parent Accidents

    Clearing the shared/parent mock pages.
    - **`/api/account`** (every role) — the signed-in user's profile. `GET`
      returns `{email, name, phone, marketingConsent, role, tenantId}` (identity
      from the token, editable extras from the users doc); `PUT` `{name?, phone?,
      marketingConsent?}`. Password change / sign-out are Firebase client ops.
    - **`/api/privacy`** (every role) — GDPR surface. `GET` → `{summary}` of what
      we hold; `GET /export` → the full JSON download of the caller's own data
      (a parent's children, bookings, meal orders, medications, moments);
      `POST /delete-request` records a deletion request (de-duped) — **it does
      not hard-delete** (safeguarding records must be retained; the platform
      actions it lawfully).
    - **Accidents (parent read)** — `GET /api/incidents` (and
      `?kind=accident`) now returns a **parent** their own children's records
      (was 403), scoped by the child's `parentUid`. Parents still can't log
      (read-only). Operator/staff behaviour unchanged.

    ## v0.29.0 — Parent medication (digital consent)

    Replaces the legacy parent "Medication" prototype with a real flow. The
    consent gate is the whole point of medication — and the most authentic
    consent is the parent's own, so a parent now authorises digitally.
    - **`POST /api/medications/authorise`** (parent) `{tenantId, childId,
      childName, name, dose, route?, condition?, schedule?, asNeeded?, dates?,
      notes?}` — creates the medication **already consented** (`consentGranted:
      true`, `consentBy` = the parent, `source: "parent"`). Gated: the child
      must be on the parent's account AND they must have booked that provider.
      It flows straight into the operator's existing administer path (the
      consent gate is satisfied), so staff can give it and record doses.
    - **`POST /api/medications/:id/withdraw`** (parent) — withdraw consent:
      archives the med and flips `consentGranted:false` (no more doses), but
      **keeps the record** so the dose history survives.
    - **Parent reads now work** (were 403): `GET /api/medications` and
      `GET /api/medications/administrations` return the parent's OWN children's
      medications + dose history (the MAR they're entitled to), across every
      provider. Scoped by the child's `parentUid`.

    ## v0.28.0 — Meal ordering (parent meals shop)

    Replaces the legacy parent "Meals" prototype with a real order flow. An
    operator publishes a menu of orderable meals; a parent who's booked with
    that provider builds a basket and places an order for a child on a date.
    **Prices are always server-computed** (a client-sent price is ignored).
    - **`/api/meal-options`** — the orderable menu. Operator CRUD `{name, price,
      description?, allergens?, active}`. `GET` is role-aware: operator sees the
      whole menu; a **parent passes `?tenantId=`** (must have booked them) and
      gets only ACTIVE items.
    - **`/api/meal-orders`** — `POST` (parent) `{tenantId, date, childName,
      childId?, items:[{optionId, qty}]}` → each option re-priced from the
      server, order created `placed`/`Unpaid`; `GET` is role-aware (parent:
      their orders; operator: the tenant's, `?date=`); `POST /:id/pay`
      (operator records payment → `Paid`); `POST /:id/cancel` (the parent while
      unpaid, or the operator any time).
    - Order is placed **Unpaid** — the provider collects and marks it paid.
      Online card capture is the same deferred-Stripe piece as the booking
      checkout; not wired here yet. Realtime `mealOptions` / `mealOrders`.

    ## v0.27.0 — Email (the out-of-app channel)

    Completes Communication. An operator emails their families through the
    existing transactional mailer. **Operators only.**
    - **`POST /api/emails/send`** `{subject, body, audience: all|one, to?,
      dryRun?}` — `all` = every distinct booker email (booked, not cancelled/
      declined); `one` = a single address. `dryRun:true` returns who WOULD
      receive it (`{recipientCount, sample}`) and sends/records nothing — a
      safe preview before a blast. A real send fires the mail (fire-and-forget)
      and records the send in `emails`. Capped at 2000 recipients.
    - **`GET /api/emails/recipients`** — the "all" audience size + a sample.
    - **`GET /api/emails`** — the send history (subject, audience,
      recipientCount, who, when).

    ## v0.26.0 — Split fees (franchisor royalties)

    A franchise is a `franchiseId`-scoped role **within** a company's tenant,
    so this is the HQ's royalty view. **Company accounts only.**
    - **`GET /api/splitfees`** — groups the company's bookings by `franchiseId`,
      sums each franchise's `revenue` (counted bookings — not cancelled/declined/
      waitlisted) and `collected` (`amountPaid`), and applies the configured
      royalty as a `fee`. Returns `{settings, franchises[], direct, totals}` —
      `direct` is HQ's own franchise-less bookings (no royalty). Franchises with
      no bookings still appear as £0 rows.
    - **`PUT /api/splitfees/settings`** `{basis: revenue|perBooking, rate?,
      perBookingFee?}` — the royalty basis (a % of revenue, or a flat fee per
      booking), stored on `tenant.splitFees`.
    No new collection — reads bookings + tenant settings (realtime via the
    existing `bookings` channel).

    ## v0.25.0 — Marketing: discount codes

    Customer-entered promo codes, distinct from the automatic per-listing
    discount RULES. Operators manage them; a parent applies one at checkout.
    - **`/api/discounts`** — operator CRUD. `POST` `{code, type: percent|amount,
      value, minSpend?, expiry?, usageLimit?, active}` (codes are upper-cased,
      unique per tenant → 409 on dupe; a percentage over 100 → 400). `GET` /
      `PUT/:id` / `DELETE/:id`.
    - **`POST /api/discounts/validate`** `{tenantId, code, subtotal}` — a
      signed-in parent previews a code before checkout → `{valid, off}` or
      `{valid:false, reason}`. Read-only; no redemption.
    - **Applied at checkout.** `POST /api/my/bookings` now takes an optional
      `discountCode`. The server validates it (same `lib/discountCodes` the
      preview uses, so preview == charge), applies the reduction to the pass
      subtotal (after automatic discounts, before add-ons), spreads it across
      the basket, records `discountCode` on each booking, and bumps the code's
      `usedCount`. An invalid/expired/exhausted/min-spend-unmet code → 400 (the
      basket is not booked). New booking field **`discountCode`**.

    ## v0.24.0 — Documents & Compliance

    Ofsted/safeguarding readiness. Both tenant-scoped, realtime; **operators
    write, staff read** (staff need the policies and their own board).
    - **`/api/documents`** — the document store (policies, risk assessments,
      insurance, certificates). `POST` (operators) `{title, category, url,
      fileType?, notes?}` — files go through the existing `/api/uploads`, or
      paste a link. `DELETE/:id` (operators). `GET` (operators + staff).
    - **`/api/compliance`** — staff certifications with **expiry tracking**.
      `{staffName, type, reference?, issued?, expiry, documentUrl?, notes?}`;
      `POST`/`PUT/:id`/`DELETE/:id` (operators), `GET` (operators + staff).
      GET derives a `status` per cert — `expired` (past `expiry`), `expiring`
      (within 45 days) or `valid` — sorts soonest-first, and leads with a
      `summary:{total, expired, expiring, valid}` so the board shows what
      needs action.

    ## v0.23.0 — Money extras: Expenses, Purchasing, Subscription

    Rounds out the Money section beyond Payments + Reconciliation. All three
    are **operators-only** (staff don't see Money), tenant-scoped, platform via
    `?tenantId=`.
    - **`/api/expenses`** — outgoings. `POST` `{date, category, amount,
      supplier?, notes?, receiptUrl?}`; `PUT/:id`, `DELETE/:id`. `GET` returns
      `{items, summary:{total, count, byCategory}}`. Realtime `expenses`.
    - **`/api/purchasing`** — purchase orders / supplier invoices. `{supplier,
      reference?, date, dueDate?, amount, status: draft|sent|received|paid|
      cancelled, notes?}`. `GET` returns `{items, summary:{count, outstanding,
      overdue}}` — `outstanding` counts `sent`+`received` (committed, unpaid);
      each item flags `overdue` when past `dueDate` and still unpaid. Realtime
      `purchaseOrders`.
    - **`/api/subscription`** — the tenant's plan. `GET` → `{current, plans[],
      billingConfigured:false}`; `PUT` `{plan: starter|pro|premium}` records the
      choice on the tenant. **No billing integration yet** — selecting a plan
      stores intent, it does not charge (Stripe Billing is a later milestone).

    ## v0.22.0 — Communication: Newsfeed + Messages (two-sided)

    The first properly two-sided feature — providers and the families who
    booked them talk to each other. The relationship is always gated on a
    booking: you can only reach someone you have one with.
    - **Newsfeed** `/api/posts` — a provider broadcasts an update to all their
      families. `POST` (operators + staff) `{title?, body, photoUrl?}`;
      `DELETE /:id` (operators). `GET` is role-aware: an operator sees the
      tenant's posts, a **parent sees the feed of every provider they've
      booked** (posts from tenants they have a booking with).
    - **Messages** `/api/messages` — 1:1 threads, one per (provider, parent)
      pair, keyed deterministically so both sides converge.
      - `GET /threads` — the caller's conversations (parent: theirs; operator:
        the tenant's), newest activity first, with per-side unread counts.
      - `GET /threads/:id` — the messages; **marks the caller's side read**.
      - `POST /` — send, creating the thread if needed. Operator body
        `{parentEmail, parentName?, body}` (must be a customer → 400 if not);
        parent body `{tenantId, body}` (must have booked them → 403 if not).
    - **`GET /api/my/providers`** — the distinct providers (tenantId + name) a
      parent has booked, powering the newsfeed labels and the "message a
      provider" picker.
    - Realtime: new collections `posts` / `threads` / `messages` (operators
      tenant-scoped; parents by their email / global feed).

    ## v0.21.0 — Operator dashboard (landing screen)

    **`GET /api/dashboard`** — one read that aggregates data the other
    routes already own into the operator's home screen. No new collection.
    Returns:
    - `today` — sessions running today (listing, times, `booked`/`capacity`)
      and the total `booked` on site.
    - `next` + `upcoming[]` — the next session and the next few, across open
      blocks, with `spotsLeft`.
    - `bookings` — `live` (not cancelled/declined), `newThisWeek`, `waitlist`.
    - `occupancy` — `booked`/`capacity`/`pct` across open runs with sessions
      still to come.
    - `money` — `takenThisWeek` (payment records in, refunds excluded),
      `outstanding` (same OWES rule as reconciliation), `overdueVouchers`,
      `awaitingVoucher`.
    - `counts` — `listings`, `activeBlocks`.
    Operators only (platform via `?tenantId=`); realtime via the existing
    `bookings`/`blocks`/`listings`/`payments` channels.

    ## v0.20.0 — Run the day: Tasks, Trips, Schedule (+ Calendar/Locations)

    Finishes the **Run the day** section. Three new tenant-scoped, realtime
    collections; staff use them, operators own them (delete = operators).
    Calendar and Locations are UI-only reads over data you already serve
    (blocks' sessions on `/api/listings`, venues on `/api/library`) — no new
    endpoints.
    - **`/api/tasks`** — the team's shared to-do list. `{title, notes?,
      assignee?, dueDate?, priority: low|normal|high, done}`. GET sorts
      open-first, then priority, then due date; ticking sets `completedAt`.
      Staff + operators create/tick; **operators delete**.
    - **`/api/trips`** — off-site trip record. `{destination, date,
      departTime?, returnTime?, transport?, childNames[], staff[],
      headcount?, riskAssessment?, consentObtained, notes?, status:
      planned|completed|cancelled}`. `headcount` defaults to `childNames`
      length. Staff + operators create/edit; **operators delete**.
    - **`/api/shifts`** — the staff rota. `{staffName, staffId?, date,
      start, end, role?, listingId?, notes?}`. `GET ?from=&to=` windows the
      week; sorted by date then start. Staff **read** (they need to know
      when they're on); **operators** write/delete.
    - All three tenant-scoped (platform via the usual account scoping),
      parents 403, realtime collections `tasks` / `trips` / `shifts`.

    ## v0.19.0 — Reconciliation (Money)

    Matching incoming money to bookings — the admin job the doc calls the
    one providers dread. Card settles via Stripe; TFC, vouchers, bank
    transfer and cash land off-platform and are matched here.
    - **`GET /api/reconciliation`** — outstanding bookings (Unpaid /
      Invoice sent / Awaiting voucher / Partially paid, with money still
      due), each with `amount` / `amountPaid` / `outstanding`, method,
      voucher scheme, and an `overdue` flag (a voucher past its
      `voucherReceiveBy`). Plus a `summary`: total outstanding, overdue
      count, awaiting-voucher count, and a by-method breakdown.
    - **`POST /api/bookings/:ref/record-payment`** `{amount, method?,
      reference?, date?}` — log money received. **Partial-aware**:
      accumulates `amountPaid`; pay becomes `Paid` when covered, else the
      new state `Partially paid`. Writes a `payments` record (with the
      reference) for the trail. Operators only.
    - New booking field `amountPaid`; new pay state `Partially paid`.

    ## v0.18.0 — Moments (Pupils) — the photo feed, consent-gated

    Completes Pupils. `/api/moments` — photos a provider shares of the day.
    - **The rule: photo consent.** A child can only be tagged if their
      record has `photoConsent: true` — enforced on every create AND edit
      (409 naming the child), so a family that said "no photos" never
      appears whatever the client sends.
    - `POST /api/moments` (operators + staff): `{photoUrl (via
      /api/uploads), caption, childIds}`.
    - `GET /api/moments` is **role-aware**: a parent gets moments featuring
      THEIR children (cross-provider); an operator/staff gets the tenant's
      (optional `?date=` / `?childId=`).
    - `GET /api/moments/taggable?date=` — the day's booked children who
      HAVE consent, so the post UI only ever offers taggable kids.
    - Photos use the existing Firestore-backed image store (`/api/uploads`
      → `/api/images`) — no new storage service needed.

    ## v0.17.0 — Meals & allergies (Pupils)

    - **`GET /api/meals?date=`** — the day's menu plus the **dietary board**:
      each session's children (resolved from bookings) with their allergies,
      dietary needs and medical notes (from the child record via `childId`),
      and an **`alerts`** array wherever a child's allergy matches an
      allergen tagged on the menu (best-effort keyword match — surfaced for
      staff to verify, never suppressed). Children with needs sort first.
      `summary` counts children / dietary needs / alerts. Includes the 14 UK
      allergens as `allergens`.
    - **`PUT /api/meals/:date`** — set the day's menu (operators): meals
      `[{type, description, allergens}]`. Staff read the board; parents 403.
      Realtime `menus`.

    ## v0.16.0 — Medication (Pupils)

    Two records, because real practice is two things:
    - **`/api/medications`** — an authorised medicine for a child with the
      parent's consent (dose, condition, schedule, storage, expiry,
      `consentGranted`). CRUD; staff record, operators manage. A medication
      with a dose history can't be deleted — archive it (the MAR must
      survive).
    - **`POST /api/medications/:id/administer`** — log a dose given.
      **Gated: no dose without `consentGranted`** (and not archived) — the
      safety rule. Writes to the MAR with who gave it, when, and any notes.
    - **`GET /api/medications/administrations?date=&childId=&medicationId=`**
      — the MAR (Medication Administration Record).
    Tenant-scoped, not parent-facing. Realtime `medications` +
    `medicationAdmin`.

    ## v0.15.0 — Incidents & Accidents (Pupils)

    The safeguarding log every OFSTED-registered provider must keep.
    `/api/incidents` — one collection, `kind: "accident" | "incident"`.
    - `GET /api/incidents?kind=&childId=&from=&to=` — the tenant's log,
      newest first. Staff and operators read; platform via `?tenantId=`.
    - `POST /api/incidents` — record one (staff AND operators — staff log
      these on the ground). Stamps who + when.
    - `PUT /api/incidents/:id` — the provider, or the person who recorded
      it, can edit.
    - `DELETE /api/incidents/:id` — operators only (a safeguarding record
      isn't something whoever's on shift removes).
    Tenant-scoped, not parent-facing; `parentNotified` tracks that the
    family was informed. Realtime collection `incidents`.

    ## v0.14.0 — Payment states, child questions, vouchers, refund rules (N–Q)

    - **§P — £0 bookings are `Funded`, not `Unpaid`.** Judged on the total,
      not the method: a HAF/free place no longer sits in the unpaid filter
      forever, and gets no payment-link email.
    - **§N — provider-defined child questions.** Child records accept an
      `answers` map (question id → string); `sex` is now a free string
      (was a fixed enum, so "Prefer not to say"/custom options work); cancel
      endpoints accept a `reason` (Illness/Weather/…), stored on the cancel.
    - **§Q — childcare vouchers.** `POST /api/my/bookings` takes
      `voucherScheme` (the scheme id); the server computes the send-by /
      receive-by dates from the tenant's voucher settings, writes the
      booking `pay: "Awaiting voucher payment"` with `voucherScheme` +
      `voucherSendBy` + `voucherReceiveBy`, and emails the scheme's
      references + deadline (re-sendable via the `resend` action). Flags,
      never auto-cancels.
    - **§O — parent self-cancel refunds by policy, server-side.**
      `POST /api/my/bookings/:ref/cancel` runs the listing's cancellation
      policy (Kaz's pure `lib/cancellation.refundFor`) on the server — the
      client never computes refund money — and records the recommended
      amount on the request for the provider to approve.

    ## v0.13.0 — Ratios & groups (Run the day)

    - **`GET /api/ratios?date=`** — every session the tenant runs that day
      with its children (ages + SEND resolved from the child record),
      the **required staff** for the age mix, the staff assigned, and the
      group breakdown. Staff read; platform via `?tenantId=`.
    - **`PUT /api/ratios/:blockId/:date`** — save the session's groups
      `[{id, name, childIds, staffIds}]` (operators). One doc per session
      (`ratioGroups/{blockId}_{date}`), realtime collection `ratioGroups`.
    - Ratio maths: UK camp defaults (1:3 under-2 … 1:8 age 5–7, 1:10 age
      8+); mixed ages summed as fractional demand and rounded up, floor of
      one adult. SEND children are surfaced (`sendCount`), never auto-
      adjusted — the operator's call. Staff come from the tenant library.
    - **Bugfix:** a basket of N children created N duplicate customer rows
      (the per-booking upsert raced). Baskets now upsert the family once.

    ## v0.12.0 — childId on bookings + the family safeguarding read (§I/§J/§K)

    The safeguarding foundation Kaz's registers, ratios and child-profile
    screens need — no more matching children by name string.

    - **Booking items accept `childId`** (the saved child's record id). When
      present it's authoritative; otherwise the server falls back to a
      name match against the ACCOUNT's own children (parent = caller,
      operator `onBehalfOf` = the family). The resolved `childId` is stamped
      on the booking, and name/age come from the record. A foreign id is
      never trusted; an unknown name gets no id (no guessing).
    - **Registers resolve safeguarding data from `childId`** — photo,
      allergies, SEND (+ plan on file) and collection password — a server
      read scoped to children booked into that tenant's session. Attendees
      now carry a `child` safeguarding object (null when no confident id).
    - **`GET /api/customers/:id/family`** — the parent + their children's
      FULL records, for an operator **whose tenant the family has actually
      booked with** (a booking check, not just a customer row — so an
      operator can't harvest a stranger's children by typing their email).
      Stamps the customer↔account `uid` link on the way.
    - **`customers.uid`** is now set on the booking path too (not only
      Kaz's invite/children endpoints), and the customer's thin child list
      keeps a `childId` so the Families page joins to the real record.
    - **Extra child fields** (§K): `dietary`, `swimming`
      (none/weak/confident/strong), `careNotes`, and consents
      `suncreamConsent` / `firstAidConsent` / `walkHomeConsent`.

    ## v0.11.0 — Booking for a family (handoff §G/§H) + real pay links

    - **`POST /api/my/bookings` accepts `onBehalfOf`** (operator roles only):
      `{customerId?}` or `{name?, email, phone?}`. Same pricing/capacity/
      discount path as parents; the booking lands on the FAMILY's account —
      an existing ActivityOS account with that email is reused (never
      duplicated), otherwise one is created with **no password** and the
      single confirmation email includes Firebase's set-password link and
      the pay link. That email deliberately contains **no child data** (a
      mistyped address must never leak a child's details). Operator-taken
      bookings are Confirmed + `pay: "Invoice sent"`; `opensAt` doesn't
      bind operators.
    - **`emailPaymentLink` has a real link** now: it deep-links to
      `/custdash/bookings?pay={ref}`, which auto-opens the Stripe card
      payment for that booking after sign-in.
    - **Offline settlements are recorded**: the `paid` action writes a
      `payments` record (`offline: true`, method, amount, recordedBy) so
      TFC/HAF/PayPal have an entry for reconciliation, not just a flag.

    ## v0.10.0 — The waiting list (handoff §E)

    A waitlisted BOOKING is the queue entry — no separate collection.
    Queues are **per date** (the booking's `days`), FIFO by ref.

    - **Baskets split by date, never by child**: dates with space book,
      full dates queue — all children on a date together. The checkout
      response gains `waitlist: [{ref, date, position}]`
      ("2nd in line for 12 Aug"). `listing.waitlistSize` caps each date's
      queue (409 when full); `waitlist: false` still refuses instead.
    - **New booking status `Offered`**: the seat is HELD (counts toward
      capacity) for **2 hours** (`offeredAt` / `offerExpiresAt`). Parents
      answer via `POST /api/my/bookings/{ref}/accept-offer` (→ Confirmed,
      then pay as normal) or `/decline-offer` (→ Cancelled, place passes
      on). Expired offers sweep back to Waitlisted automatically. Offered
      children are NOT expected on registers.
    - **Actions**: `offer` (new) = offer with the 2h hold — rejected 409
      while the date is still full; `promote` stays the operator's
      immediate, possibly overbooking, seat — its response now carries
      `waiting` (how many are queued for those dates) so the UI can warn.
      Operator-created bookings that land on the waitlist return their
      `waitlist` positions too.
    - **`listing.waitlistMode`** (builder step 11, now enforced):
      `"manual"` (default) — nothing automatic, the operator chooses whom
      to offer; `"auto"` — any freed seat (cancellation, decline, expiry)
      is offered to the front of that date's queue, with one email
      ("a place is yours for 2 hours").

    ## v0.9.1 — Day-accurate capacity + server-side publish validation

    - **Per-session booked counts** (handoff §A): blocks now carry
      `capacityScope` and per-date `dayCounts`, maintained transactionally
      on every booking transition. With `capacityScope: "day"` a cap of 20
      means 20 **per date** — a Mon–Fri camp sells up to 100 day-places,
      and "full on the 11th" no longer blocks the 12th. `"listing"` keeps
      the whole-run cap. Block summaries (everywhere blocks are embedded)
      now expose `capacityScope` and
      `sessions: [{date, start, end, capacity, bookedCount, spotsLeft}]` —
      the traffic-light calendar reads per date with no front-end change.
      Block-level `spotsLeft` under day scope = space on the BUSIEST day
      (what a whole-run pass needs). Existing blocks backfilled.
    - **Publishing is validated server-side** (handoff §C): a write that
      sets `status: "live"` must have a name, a venue, dates producing at
      least one running day, and passes — otherwise 400 naming what's
      missing. Existing live docs aren't re-judged; partial updates that
      don't touch status don't either.

    ## v0.9.0 — Payments: Stripe Connect (build item 7)

    Tag `payments`. Per the product doc, each provider connects their OWN
    Stripe account (Express) and parents' card payments are **direct
    charges on the provider's connected account** — the money never touches
    ActivityOS; the platform only records payments and refunds for
    oversight (`GET /api/payments`).

    - Operator: `POST /api/payments/connect` → Stripe-hosted Express
      onboarding URL; `GET /api/payments/status` → connection state.
    - Parent: `POST /api/payments/checkout` `{refs}` → ONE PaymentIntent
      for the bookings (a basket pays at once), returns `{clientSecret,
      stripeAccount, amount}` for Stripe's Payment Element (initialise
      Stripe.js WITH `stripeAccount`); then
      `POST /api/payments/checkout/{id}/confirm` verifies with Stripe and
      flips the bookings to `pay: "Paid"` (idempotent). Payable = status
      `Confirmed`, or `pay: "Invoice sent"` (operator-taken).
    - `refund-approve` on a Stripe-paid booking now issues the REAL refund
      on the connected account (the cancel flow's agreed amount); outcome
      recorded in `payments` (type `refund`).
    - Amounts are always computed server-side from the booking records —
      the client never sends a price.
    - DEV ONLY: `STRIPE_PLATFORM_FALLBACK=1` lets un-onboarded providers
      take TEST payments on the platform account (flagged
      `platformFallback` on the record). Remove in production.
    - Realtime collection `payments` (tenant-scoped).

    ## v0.8.1 — Customers & families become real (and self-filling)

    - `/api/customers` grows `POST` / `PUT /{id}` / `DELETE /{id}`
      (operators; staff read-only). Shape: `{name, email, phone,
      children: [{name, age?, dob?}]}`.
    - **Every booking upserts the family automatically** — operator-taken
      and parent checkout alike: new booker email → new customer; known
      email → the booked child is added to their `children` if new. The
      Customers & families page fills itself.

    ## v0.8.0 — Public storefront + the real parent checkout

    - **Listings are public.** `GET /api/listings` and `GET /api/listings/{id}`
      no longer require a token: anonymous visitors get parent-shaped reads
      (live+public feed; hidden by direct link; drafts 404). A token still
      changes what you see (`?mine=1`, your own drafts) — the web app's
      `/book/{id}` page is built on this.
    - **`POST /api/my/bookings` takes a BASKET** (legacy single-booking body
      still accepted): `{listingId, blockId, method, items: [{pass,
      periodId?, dates?, child, age, addons?}]}`. One booking per item,
      atomically — the whole basket gets places or the whole basket
      waitlists together (no splitting siblings). Response:
      `{bookings, total}`.
    - **Every price is server-computed**: pass/timing from the bundle's
      resolver, per-day add-ons from the tenant library × chosen days,
      automatic discounts across the basket (uniform baskets get the exact
      engine incl. multi-person rules; mixed baskets price per line — never
      overcharging). Clients send choices, never amounts.
    - **`bookingType: "auto"` now means instant `Confirmed`** for parent
      bookings with space; `"manual"` stays `Approval needed`.
    - **Bookings carry `days`** (the ISO session dates they occupy) and
      `timing` (the chosen period). Registers only expect a child on their
      booked days, and marking them on another day is a 409.

    ## v0.7.0 — Registers (run the day)

    Tag `registers`. A register is one block-session (a block + a date).
    **Who's expected** comes from the bookings holding a place (Confirmed /
    Approval needed) on that block; the register only stores what happened on
    the day — check-in / check-out / absent, per booking ref, stamped with
    who marked it and when.

    - `GET /api/registers?date=YYYY-MM-DD` (default today) — every session
      the tenant runs that day, attendees merged with attendance, plus
      `counts` (expected/in/out/absent). Staff can read; platform passes
      `?tenantId=`; parents 403.
    - `POST /api/registers/{blockId}/{date}/mark` `{ref, status}` —
      `in` | `out` (keeps the check-in time) | `absent` | `expected` (undo,
      clears the entry). **This is the one write the `staff` role has** —
      taking attendance is their job. Operators can mark too; platform and
      parents cannot. Marking a booking that doesn't hold a place is a 409.
    - Realtime collection `registers` (tenant-scoped) — two devices marking
      the same session stay in sync live.

    ## v0.6.0 — Listings persist the WHOLE builder draft

    Answers to the listings handoff's §0, now live:

    1. **Saving a listing generates dated `blocks` — yes.** The run recipe
       (`runFrom` / `runTo` / `blockMode` / `days` / `datesOff`) is turned into
       real dated runs on every create/update: weekly mode makes one block per
       calendar week, `custom` one block for the range. Generated blocks carry
       `auto: true`; blocks made by hand via `POST /api/blocks` are never
       touched. Re-saving *updates* matching blocks in place (`bookedCount`
       and open/closed survive); runs that leave the recipe are deleted when
       empty, closed when booked. No client ever creates blocks for a listing.
    2. **Free-text `dates` is therefore moot** — parent bookings always attach
       to a `blockId`, so capacity + waitlist are always enforced.
    3. **Capacity lives on the generated blocks**, sourced from
       `maxAttendees` (blank = effectively unlimited). `capacityScope` is
       stored; both scopes enforce per block for now (per-session counts are a
       later refinement).
    4. **"Take a booking" belongs in Bookings**, writing through
       `POST /api/bookings` as it stands. The operator-typed `amount` is the
       operator's authorised price (their explicit override); PARENT bookings
       never send an amount — see below.

    Also new:

    - `POST /api/listings` / `PUT` accept the **entire wizard draft**
      (title, images, sections, run recipe, capacity, policy, discounts,
      `pageStyle`…) and store it verbatim — the listing doc IS the draft.
      `name` mirrors `title`; `passes` stays the priced-tickets snapshot.
    - **`visibility` is enforced**: the browse feed (`GET /api/listings`)
      returns only `status: live`, `visibility: public`, unarchived listings.
      `hidden` = *unlisted*: excluded from the feed but fully readable and
      bookable via the new **`GET /api/listings/{id}`** (the direct link).
      Foreign drafts/archived 404 there; your own tenant sees everything.
    - `GET /api/listings/{id}` **embeds** what the customer page needs:
      `blocks` (dated runs + availability), `bundle` (the block bundle's
      server-resolved passes/timings/periods) and `library` (the venue,
      add-ons, staff and categories the listing references).
    - **`opensAt` is enforced server-side**: parent bookings before it are
      rejected `409` with `opensAt` in the body (show the countdown).
      Draft/archived listings also can't be booked (`409`).
    - **Parent booking prices are fully server-computed**: the pass price
      with the listing's automatic `discounts` applied (multi-person →
      multi-session → early-bird, best rule wins — the same shared engine
      the builder previews, `features/listings/discounts.ts`).
    - **Tenant library** (`GET`/`PUT /api/library`): the shared option lists
      (categories, venues, provided/safety/SEND/outcomes, add-ons, staff)
      that were browser-localStorage. One object per tenant, realtime
      collection name `library`.
    - **Image uploads** (`POST /api/uploads` → `{url}`; public
      `GET /api/images/{id}`): listing/library images must be uploaded
      first — data URLs inside listing docs are rejected (Firestore's 1MB
      doc limit).
    - "Send to listings" pass snapshots now include `days` (session count),
      which discount thresholds use.
    - `DELETE /api/listings/{id}` cascades the listing's empty blocks and
      409s when any block has bookings (archive instead).

    ## v0.5.0 — Blocks BUILDER (periods / passes / bundles)

    New, separate from the dated-run `blocks` model: reusable scheduling
    patterns kept in a per-tenant library. **Periods** (named time windows),
    **Passes** (booking lengths in days) and **Block bundles** (periods +
    passes + the pricing calculator). Endpoints under `/api/periods`,
    `/api/passes`, `/api/block-bundles` (tag `blocks-builder`).

    Pricing is resolved **server-side** (single master price → per-day →
    per-pass → per-timing, every value overridable); each bundle response
    carries a computed `resolved` object — render it, never re-derive it
    client-side. **"Send to listings"** (`PUT /api/block-bundles/{id}/listings`)
    associates the bundle AND snapshots the resolved pass prices into each
    listing's `passes`, which is what checkout prices from. It does NOT
    create dated runs — that remains `POST /api/blocks`. Deleting a period
    or pass cascades: its id is stripped from every bundle.

    ## ⚠ v0.4.0 breaking changes (Blocks & sessions)

    - `listing.blocks` is no longer `string[]` — it's an array of **Block**
      objects with `id`, availability (`spotsLeft`, `capacity`, `open`) and
      per-day `sessions`, joined from the new blocks collection.
    - `POST /api/my/bookings` takes `blockId` instead of `dates`.
    - `POST /api/listings` / `PUT` no longer accept a `blocks` field — blocks
      are managed via the new `/api/blocks` endpoints.
    - **Capacity is enforced**: booking a full/closed block creates the
      booking as `Waitlisted` (not an error). Confirmed and
      Approval-needed bookings hold places; cancelling/declining frees
      them; `promote` seats a waitlisted booking (may overbook — that's
      the operator's explicit call).

    ## Authentication

    Every `/api/*` endpoint (except the invite preview) requires a
    **Firebase ID token**:

    ```
    Authorization: Bearer <idToken>
    ```

    Get a token by signing in a Firebase user (Email/Password provider):

    - **From a web app** — Firebase JS SDK:
      `signInWithEmailAndPassword(auth, email, password)` then
      `await user.getIdToken()`.
    - **From curl/Postman** (for testing):
      ```
      POST https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=<WEB_API_KEY>
      { "email": "...", "password": "...", "returnSecureToken": true }
      ```
      → use the `idToken` from the response. Tokens expire after 1 hour.

    ## Tenancy & roles (server-enforced)

    Every provider is a **tenant** with fully isolated data. The API derives
    the caller's scope from the authenticated account — **there is no
    tenant/portal parameter for operators to choose**; sending someone
    else's ref simply yields 404.

    | Role | How it's created | Bookings scope | Write? |
    | --- | --- | --- | --- |
    | `platform` | set-role CLI | any tenant (`?tenantId=` filter) | no (read-only) |
    | `company` | signup (creates its tenant) | whole own tenant, incl. franchises | yes |
    | `freelancer` | signup (creates its tenant) | whole own tenant | yes |
    | `franchise` | invite link from a company | own franchise subset only | yes |
    | `staff` | invite link from an operator | own tenant | no (read-only) |
    | `parent` | signup | none — `/api/my/*` by token email | own bookings |

    Account type is chosen ONCE (`POST /api/register-role` or invite accept);
    afterwards only the `set-role` CLI can change it.

    ## Notes for UI builders

    - `answers` is an array of `[question, answer]` string pairs (tuples).
    - Mutations return the **full updated booking** — replace your local copy.
    - Prices are **server-side**: parents pick a listing + pass; the API
      resolves the amount.
    - `GET /api/me` tells you who the account is (role, tenant) — use it to
      route to the right portal after sign-in.
    - **Transactional emails are sent** to the booker on: booking created
      (request-received for parents, payment-link for operator-taken
      bookings), approve/promote, decline, refund-approve, and the `resend`
      action. Without SMTP configured they go to a dev preview inbox
      (URLs in the API log). Invite links are still shared manually.
    - Payments (Stripe / Tax-Free Childcare) come in a later milestone —
      parent bookings are created `Approval needed` / `Unpaid` and the
      payment-link button in emails is a placeholder.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: bookings
    description: Operator bookings, scoped to the caller's tenant
  - name: my
    description: The signed-in parent's own bookings
  - name: listings
    description: Listings store the whole builder draft; the run recipe generates dated blocks
  - name: library
    description: The tenant's shared listing option lists (venues, add-ons, staff…)
  - name: uploads
    description: Image storage — upload first, store the returned URL
  - name: blocks
    description: A listing's bookable runs — capacity, sessions, waitlist
  - name: blocks-builder
    description: Reusable periods / passes / bundles library with server-side pricing
  - name: reconciliation
    description: Outstanding money matched to bookings (vouchers / TFC / bank / cash)
  - name: expenses
    description: The provider's outgoings (operators only)
  - name: purchasing
    description: Purchase orders & supplier invoices (operators only)
  - name: subscription
    description: The tenant's plan (records intent — no billing integration yet)
  - name: documents
    description: The provider's document store (operators write, staff read)
  - name: compliance
    description: Staff certifications with expiry tracking (operators write, staff read)
  - name: discounts
    description: Marketing discount codes — operator CRUD + parent validate; applied at checkout
  - name: splitfees
    description: Franchisor royalty report — franchise revenue × royalty (company accounts only)
  - name: emails
    description: Out-of-app email to families — send/dry-run + history (operators)
  - name: registers
    description: Daily attendance per block-session — the staff role's one write
  - name: dashboard
    description: The operator's landing screen — aggregated read over bookings/blocks/money
  - name: posts
    description: Newsfeed — a provider's announcements to their booked families
  - name: messages
    description: 1:1 provider↔parent conversations (two-sided, booking-gated)
  - name: ratios
    description: Staff:child ratios and grouping children per session
  - name: tasks
    description: The team's shared to-do list (Run the day)
  - name: trips
    description: Off-site trips & visits — who's going, transport, risk assessment, consent
  - name: shifts
    description: The staff rota / schedule (staff read, operators write)
  - name: incidents
    description: Incidents & Accidents — the safeguarding log (staff record, operators manage)
  - name: medication
    description: Authorised medicines (parental consent) + the MAR (every dose given)
  - name: meals
    description: The day's menu + the dietary board (allergies matched against the menu)
  - name: meal-options
    description: The orderable meals menu (operator CRUD; parent reads a booked provider's)
  - name: meal-orders
    description: Parent meal orders — basket, place, pay, cancel (server-priced)
  - name: moments
    description: The photo feed — consent-gated; parents see their own child's moments
  - name: payments
    description: Stripe Connect — providers' own accounts take the money; the platform records it
  - name: customers
    description: Operator-only, tenant-scoped
  - name: invites
    description: How franchises and staff join a tenant
  - name: account
    description: The signed-in user's own profile (every role)
  - name: privacy
    description: GDPR — what we hold, export, deletion request (every role)
  - name: tenants
  - name: meta

security:
  - firebaseIdToken: []

paths:
  /health:
    get:
      tags: [meta]
      summary: Liveness check (no auth)
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /api/events:
    get:
      tags: [meta]
      summary: Realtime invalidation stream (SSE)
      description: |
        Server-Sent Events. Because `EventSource` can't set headers, pass the
        Firebase ID token as `?token=`. Emits `data: {"collection":"…"}`
        whenever something within the caller's scope changes
        (`bookings` / `listings` / `customers` / `invites` / `children` /
        `tenants` — scoped by role and tenant exactly like the REST access).
        No data flows through this channel — on an event, refetch the
        relevant endpoint. Reconnect with a fresh token on error (tokens
        expire hourly). Includes `:ping` heartbeats every 25s.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream of invalidation events
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/me:
    get:
      tags: [meta]
      summary: Who am I
      responses:
        "200":
          description: The signed-in account's role and tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string, nullable: true }
                  role: { $ref: "#/components/schemas/Role" }
                  tenantId: { type: string, nullable: true }
                  tenantName: { type: string, nullable: true }
                  franchiseId: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/register-role:
    post:
      tags: [meta]
      summary: Provision this account (once, at signup)
      description: |
        `{role: "parent"}` → parent account.
        `{role: "company"|"freelancer", businessName}` → **creates the
        tenant** and links the account as its owner.
        Locked after the first successful call (**409** afterwards).
        `franchise`/`staff` cannot self-register — they join via invites.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [role]
                  properties:
                    role: { type: string, enum: [parent] }
                - type: object
                  required: [role, businessName]
                  properties:
                    role: { type: string, enum: [company, freelancer] }
                    businessName: { type: string, example: Bright Kids Ltd }
      responses:
        "200":
          description: Parent account set
        "201":
          description: Operator tenant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  role: { type: string }
                  tenantId: { type: string }
                  tenantName: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Account type already set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/bookings:
    get:
      tags: [bookings]
      summary: List bookings in the caller's scope
      description: |
        company/freelancer → whole tenant; franchise → own subset; staff →
        tenant (read-only); platform → all tenants, optionally filtered.
      parameters:
        - name: tenantId
          in: query
          required: false
          description: Platform accounts only — filter to one tenant.
          schema: { type: string }
      responses:
        "200":
          description: Bookings, newest ref first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [bookings]
      summary: Take a manual booking (into the caller's own tenant/franchise)
      description: |
        Creates a **Confirmed** booking (pay `Invoice sent`, or `Funded`
        with amount 0 when `method` contains "HAF"). `ref`/`bid` come from
        the tenant's own counter. Franchise accounts' bookings are stamped
        with their `franchiseId`. Staff/platform: 403 (read-only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookingInput" }
      responses:
        "201":
          description: The created booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/bookings/bulk:
    post:
      tags: [bookings]
      summary: Apply a status action to many bookings at once
      description: Refs outside the caller's scope are silently skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refs, action]
              properties:
                refs:
                  type: array
                  minItems: 1
                  items: { type: string }
                  example: ["APF-10293", "APF-10294"]
                action:
                  type: string
                  enum: [approve, decline, waitlist, cancel]
      responses:
        "200":
          description: The updated bookings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/bookings/{ref}:
    get:
      tags: [bookings]
      summary: Get one booking in the caller's scope
      parameters:
        - $ref: "#/components/parameters/refPath"
        - name: tenantId
          in: query
          required: false
          description: Required for platform accounts (they have no tenant of their own).
          schema: { type: string }
      responses:
        "200":
          description: The booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/bookings/{ref}/actions:
    post:
      tags: [bookings]
      summary: Apply a workflow action to one booking
      description: |
        One endpoint for every single-booking mutation, discriminated by
        `type`. Runs in a Firestore transaction and returns the updated
        booking. Out-of-scope refs → 404. Read-only roles → 403.

        | `type` | Effect |
        | --- | --- |
        | `approve` | status → Confirmed |
        | `decline` | status → Declined |
        | `paid` | pay → Paid |
        | `recon` | toggles the reconciliation flag |
        | `promote` | waitlist → Confirmed (+ note) |
        | `refund-approve` | cancel.refund → approved, pay → Refunded |
        | `refund-decline` | cancel.refund → declined |
        | `resend` | no mutation — re-sends the payment-link email |
        | `cancel` | cancels whole booking, writes `cancel` record |
        | `cancel-child` | cancels one child (`ki` = index in `kids`) |
        | `cancel-day` | cancels one day for one child |
        | `change-day` | moves one booked day to another date |
        | `note` | saves the mentor note |
      parameters:
        - $ref: "#/components/parameters/refPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingAction" }
            examples:
              approve: { value: { type: approve } }
              cancelPartialRefund: { value: { type: cancel, refund: partial, amount: 50 } }
              cancelOneDay: { value: { type: cancel-day, ki: 0, date: "Tue 29 Jul" } }
              saveNote: { value: { type: note, text: "Parent called — arriving late Monday." } }
      responses:
        "200":
          description: The updated booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/my/bookings:
    get:
      tags: [my]
      summary: The signed-in parent's bookings
      description: All bookings (any provider) whose booker email matches the verified token.
      responses:
        "200":
          description: The parent's bookings, newest ref first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [my]
      summary: Book places (parent checkout — basket)
      description: |
        Takes a **basket** and creates one booking per item **in the
        listing's tenant**, atomically: the whole basket gets places or the
        whole basket waitlists together (no splitting siblings). The legacy
        single-booking body (`{listingId, blockId, pass, child, age,
        method}`) is still accepted and answers with a single Booking.

        **Every price is server-computed** — pass/timing via the bundle's
        pricing resolver, per-day add-ons from the tenant library × the
        item's chosen days, then the listing's automatic discounts across
        the basket (multi-person → multi-session → early-bird; best rule of
        each kind wins). Clients send choices, never amounts.

        Optional **`discountCode`** (Marketing): validated server-side and
        applied to the pass subtotal after automatic discounts; an
        invalid/expired/exhausted/min-spend-unmet code → 400 and nothing is
        booked. Each resulting booking carries `discountCode`.

        `dates` picks which session days the item occupies (must belong to
        the block; at most the pass's day count; default = every session,
        capped to the pass length). Bookings store these as `days`, which
        registers use.

        Status: `bookingType: "auto"` listings seat parents immediately
        (`Confirmed`); `"manual"` creates `Approval needed`. Always
        `pay: "Unpaid"` until payments land.

        Rejected `409` when: the listing is a draft/archived; `opensAt` is
        in the future (the response body includes `opensAt` — show the
        countdown); or the block is full and the listing's waitlist is off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingId, blockId, method, items]
              properties:
                listingId: { type: string, example: lst-1 }
                blockId:
                  type: string
                  description: One of the listing's blocks. Full/closed block → whole basket Waitlisted.
                method: { type: string, enum: [Card, Tax-Free Childcare] }
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [pass, child, age]
                    properties:
                      pass: { type: string, example: 4-day pass }
                      periodId: { type: string, description: A timing from the listing's bundle (GET /:id → bundle.periods). }
                      dates:
                        type: array
                        items: { type: string }
                        description: Chosen session days (ISO), e.g. which day a 1-day pass is for.
                      child: { type: string, example: Jack J }
                      age: { type: integer, example: 8 }
                      addons:
                        type: array
                        items:
                          type: object
                          required: [id]
                          properties:
                            id: { type: string, description: Library add-on id }
                            days:
                              type: array
                              items: { type: string }
                              description: Per-day add-ons only — defaults to the item's days.
      responses:
        "201":
          description: The created bookings and the basket total (legacy body → a single Booking)
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items: { $ref: "#/components/schemas/Booking" }
                  total: { type: number }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Not open for booking (draft/archived, before opensAt, or full with waitlist off)

  /api/my/bookings/{ref}/accept-offer:
    post:
      tags: [my]
      summary: Accept a waiting-list offer (→ Confirmed)
      description: The seat was already held by the offer; pay as normal afterwards. 409 when there's no open offer or it expired.
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The confirmed booking
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No open offer / offer expired

  /api/my/bookings/{ref}/decline-offer:
    post:
      tags: [my]
      summary: Decline a waiting-list offer (place passes on)
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The cancelled booking; in auto mode the place is offered to the next in the queue
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No open offer

  /api/my/bookings/{ref}/cancel:
    post:
      tags: [my]
      summary: Request cancellation of one of my bookings
      description: |
        Parent-initiated cancellation **request**: `status: "Cancelled"`,
        `cancel.by: "Booker"`, `cancel.refund: "pending"` — the provider
        resolves it with `refund-approve`/`refund-decline`. Lookup is scoped
        to the caller's email, so another family's ref is simply 404.
      parameters:
        - $ref: "#/components/parameters/refPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                msg: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The updated booking (refund pending)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/my/children:
    get:
      tags: [my]
      summary: The signed-in parent's child profiles
      responses:
        "200":
          description: Children, sorted by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChildProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [my]
      summary: Add a child profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChildProfileInput" }
      responses:
        "201":
          description: The created child
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChildProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/my/children/{id}:
    put:
      tags: [my]
      summary: Update one of my children
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChildProfileInput" }
      responses:
        "200":
          description: The updated child
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChildProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [my]
      summary: Remove one of my children
      description: Existing bookings keep their own copy of the child's details.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/listings:
    get:
      tags: [listings]
      summary: Browse feed (public; or my tenant's listings with ?mine=1)
      security: []
      description: |
        **No auth required.** Only `status: live`, `visibility: public`,
        unarchived listings, with `tenantId` / `tenantName` and joined
        `blocks`. Hidden listings are *unlisted*: absent here, fully served by
        `GET /api/listings/{id}`.

        **Marketplace opt-in (v0.31.0):** with no `?tenantId=`, this is the
        cross-provider marketplace and returns only providers who've opted in
        (`settings.marketplaceListed`), **plus** a signed-in parent's own
        providers (anyone they've booked). With **`?tenantId=`** it's that one
        provider's storefront — their public listings, opt-in irrelevant.

        With a token and `?mine=1`: ALL of the caller's own tenant's
        listings — drafts, hidden and archived included (the operator
        management view).
      parameters:
        - name: mine
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
        - { name: tenantId, in: query, required: false, description: "One provider's storefront (opt-in bypassed)", schema: { type: string } }
      responses:
        "200":
          description: Listings ordered by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Listing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [listings]
      summary: Create a listing in the caller's own tenant
      description: |
        Operators with write access (company/freelancer/franchise). Send the
        **whole builder draft** (see `ListingDraft`) — it is stored verbatim,
        `name` mirrors `title`, and the run recipe is turned into dated
        `blocks` automatically (see the v0.6.0 notes). Images must be
        uploaded first (`POST /api/uploads`) — data URLs are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingDraft" }
      responses:
        "201":
          description: The created listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/listings/{id}:
    get:
      tags: [listings]
      summary: One listing — the direct link (`/book/{id}` reads this)
      security: []
      description: |
        **No auth required.** Returns `hidden` listings too (hidden =
        unlisted but bookable by link). Drafts/archived 404 unless the
        caller sends a token and their tenant owns them.
        Embeds everything the customer page needs — `blocks` (dated runs +
        availability), `bundle` (the block bundle's server-resolved
        passes / timings / periods) and `library` (the venue, add-ons,
        staff and categories this listing references).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The listing with blocks, bundle and library embedded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [listings]
      summary: Update one of my tenant's listings
      description: |
        Accepts the full draft or a partial patch (e.g. just `{visibility}`
        or `{archived}`). Changing any run-recipe field re-syncs the
        generated blocks.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingDraft" }
      responses:
        "200":
          description: The updated listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [listings]
      summary: Delete one of my tenant's listings
      description: |
        Cascades the listing's (empty) blocks. 409 when any block has booked
        places — archive the listing instead. Past bookings keep their
        denormalised listing name.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The listing has bookings — archive it instead

  /api/library:
    get:
      tags: [library]
      summary: My tenant's shared listing library
      description: |
        The option lists reused across all of a tenant's listings —
        categories, venues, provided / safety / SEND / outcomes chips,
        add-ons, staff, emojis. `null` until first saved. Any member of the
        tenant may read; parents never call this (the slice a listing uses is
        embedded in `GET /api/listings/{id}`). Realtime collection:
        `library`.
      responses:
        "200":
          description: The library object, or null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [library]
      summary: Replace my tenant's library
      description: |
        Operators only. Whole-object replace. Add-on images must be uploaded
        via `POST /api/uploads` first (413 when the object is oversized).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                categories: { type: array, items: { type: object } }
                venues: { type: array, items: { type: object } }
                provided: { type: array, items: { type: string } }
                safety: { type: array, items: { type: string } }
                send: { type: array, items: { type: string } }
                outcomes: { type: array, items: { type: string } }
                addons: { type: array, items: { type: object } }
                staff: { type: array, items: { type: object } }
                emojis: { type: object }
      responses:
        "200":
          description: The stored library
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: Library too large

  /api/uploads:
    post:
      tags: [uploads]
      summary: Upload an image (operators)
      description: |
        Body `{dataUrl}` — a base64 `data:image/*` URL (the builder's
        canvas-compressed JPEGs). Returns the public URL to store in the
        listing/library. Max ~900KB decoded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataUrl]
              properties:
                dataUrl: { type: string, example: "data:image/jpeg;base64,/9j/4AAQ…" }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  url: { type: string, example: "http://localhost:4000/api/images/aB3…" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: Image too large

  /api/images/{id}:
    get:
      tags: [uploads]
      summary: Serve an uploaded image (public, no auth)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The image bytes (immutable cache headers)
        "404": { $ref: "#/components/responses/NotFound" }

  /api/blocks:
    get:
      tags: [blocks]
      summary: My tenant's blocks
      parameters:
        - name: listingId
          in: query
          required: false
          schema: { type: string }
        - name: tenantId
          in: query
          required: false
          description: Platform accounts only.
          schema: { type: string }
      responses:
        "200":
          description: Blocks sorted by start date
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Block" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [blocks]
      summary: Create a block on one of my listings
      description: |
        Provide `schedule` (sessions are generated for every matching
        weekday in the date range) **or** an explicit `sessions` array.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockInput" }
      responses:
        "201":
          description: The created block
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Block" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/blocks/{id}:
    put:
      tags: [blocks]
      summary: Update a block
      description: |
        `bookedCount` is never client-writable; a block can't move to a
        different listing. Set `open: false` to pause sales.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockInput" }
      responses:
        "200":
          description: The updated block
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Block" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [blocks]
      summary: Delete a block
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Block still has bookings holding places
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/blocks/{id}/attendees:
    get:
      tags: [blocks]
      summary: Who's booked into this block (the register foundation)
      description: Counted (Confirmed / Approval needed) and Waitlisted bookings with their children.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Block + attendees
          content:
            application/json:
              schema:
                type: object
                properties:
                  block: { $ref: "#/components/schemas/Block" }
                  attendees:
                    type: array
                    items:
                      type: object
                      properties:
                        ref: { type: string }
                        status: { type: string }
                        booker: { type: string }
                        email: { type: string }
                        seats: { type: integer }
                        children:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              age: { type: number }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/reconciliation:
    get:
      tags: [reconciliation]
      summary: Outstanding money + a by-method summary
      parameters: [{ name: tenantId, in: query, required: false, description: Platform only, schema: { type: string } }]
      responses:
        "200": { description: "{items[], summary}" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/bookings/{ref}/record-payment:
    post:
      tags: [reconciliation]
      summary: Log money received against a booking (partial-aware)
      parameters: [{ name: ref, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number }
                method: { type: string }
                reference: { type: string }
                date: { type: string }
      responses:
        "200": { description: "The booking (pay → Paid or Partially paid)" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/dashboard:
    get:
      tags: [dashboard]
      summary: The operator's home screen — today, occupancy, money, what's next
      parameters: [{ name: tenantId, in: query, required: false, description: Platform only, schema: { type: string } }]
      responses:
        "200": { description: "{today, next, upcoming[], bookings, occupancy, money, counts}" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/meal-options:
    get:
      tags: [meal-options]
      summary: The orderable menu — operator (own) or parent (?tenantId=, booked, active only)
      parameters: [{ name: tenantId, in: query, required: false, schema: { type: string } }]
      responses:
        "200": { description: Array of meal options }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [meal-options]
      summary: Add a meal to the menu (operators)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name: { type: string }
                price: { type: number }
                description: { type: string }
                allergens: { type: array, items: { type: string } }
                active: { type: boolean, default: true }
      responses:
        "201": { description: The created option }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/meal-options/{id}:
    put:
      tags: [meal-options]
      summary: Edit / hide a meal (operators)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: The updated option }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [meal-options]
      summary: Remove a meal (operators)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ok:true}" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/meal-orders:
    get:
      tags: [meal-orders]
      summary: Orders — parent (own) or operator (the tenant's, ?date=)
      parameters: [{ name: date, in: query, required: false, schema: { type: string } }]
      responses:
        "200": { description: Array of orders (newest first) }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [meal-orders]
      summary: Place an order (parent) — prices computed server-side
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, date, childName, items]
              properties:
                tenantId: { type: string }
                date: { type: string }
                childName: { type: string }
                childId: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [optionId, qty]
                    properties: { optionId: { type: string }, qty: { type: integer } }
      responses:
        "201": { description: "The created order (placed/Unpaid, server total)" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/meal-orders/{id}/pay:
    post:
      tags: [meal-orders]
      summary: Record payment on an order (operators) → Paid
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The order (pay → Paid) }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The order was cancelled }

  /api/meal-orders/{id}/cancel:
    post:
      tags: [meal-orders]
      summary: Cancel an order (the parent while unpaid, or the operator)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ok:true}" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Paid order — the provider must cancel it }

  /api/account:
    get:
      tags: [account]
      summary: The signed-in user's profile
      responses:
        "200": { description: "{email, name, phone, marketingConsent, role, tenantId}" }
        "400": { $ref: "#/components/responses/BadRequest" }
    put:
      tags: [account]
      summary: Update editable profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
                marketingConsent: { type: boolean }
      responses:
        "200": { description: "{name, phone, marketingConsent}" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/privacy:
    get:
      tags: [privacy]
      summary: What we hold about the caller (a summary of counts)
      responses:
        "200": { description: "{role, summary}" }

  /api/privacy/export:
    get:
      tags: [privacy]
      summary: Download the caller's own data (JSON)
      responses:
        "200": { description: "{generatedAt, account, …parent data}" }

  /api/privacy/delete-request:
    post:
      tags: [privacy]
      summary: Request account/data deletion (recorded, not an immediate wipe)
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        "201": { description: Request logged }
        "200": { description: "{ok:true, alreadyRequested:true} — already had one pending" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/emails:
    get:
      tags: [emails]
      summary: The send history (operators)
      parameters: [{ name: tenantId, in: query, required: false, description: Platform only, schema: { type: string } }]
      responses:
        "200": { description: Array of sent emails (newest first) }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/emails/recipients:
    get:
      tags: [emails]
      summary: The "all families" audience size + a sample (operators)
      parameters: [{ name: tenantId, in: query, required: false, description: Platform only, schema: { type: string } }]
      responses:
        "200": { description: "{count, sample[]}" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/emails/send:
    post:
      tags: [emails]
      summary: Email families (or dry-run to preview recipients) — operators
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, body]
              properties:
                subject: { type: string }
                body: { type: string }
                audience: { type: string, enum: [all, one], default: all }
                to: { type: string, description: "recipient for audience=one" }
                dryRun: { type: boolean, default: false, description: "preview recipients; no send, no record" }
      responses:
        "200": { description: "dry-run: {dryRun:true, recipientCount, sample}" }
