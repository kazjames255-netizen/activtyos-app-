              properties:
                orderedIds:
                  type: array
                  items: { type: string }
      responses:
        "200": { description: Reordered }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/block-bundles/{id}:
    put:
      tags: [blocks-builder]
      summary: Update a bundle (listingIds/order managed via their own endpoints)
