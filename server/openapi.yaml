openapi: 3.0.3
info:
  title: ActivityOS API
  version: 0.8.0
  description: |
    Express + Firestore backend for ActivityOS — a **multi-tenant** platform
    for children's activity providers.

    ## v0.8.0 — Public storefront + the real parent checkout

    - **Listings are public.** `GET /api/listings` and `GET /api/listings/{id}`
      no longer require a token: anonymous visitors get parent-shaped reads
      (live+public feed; hidden by direct link; drafts 404). A token still
      changes what you see (`?mine=1`, your own drafts) — the web app's
      `/book/{id}` page is built on this.
    - **`POST /api/my/bookings` takes a BASKET** (legacy single-booking body
      still accepted): `{listingId, blockId, method, items: [{pass,
      periodId?, dates?, child, age, addons?}]}`. One booking per item,
      atomically — the whole basket gets places or the whole basket
      waitlists together (no splitting siblings). Response:
      `{bookings, total}`.
    - **Every price is server-computed**: pass/timing from the bundle's
      resolver, per-day add-ons from the tenant library × chosen days,
      automatic discounts across the basket (uniform baskets get the exact
      engine incl. multi-person rules; mixed baskets price per line — never
      overcharging). Clients send choices, never amounts.
    - **`bookingType: "auto"` now means instant `Confirmed`** for parent
      bookings with space; `"manual"` stays `Approval needed`.
    - **Bookings carry `days`** (the ISO session dates they occupy) and
      `timing` (the chosen period). Registers only expect a child on their
      booked days, and marking them on another day is a 409.

    ## v0.7.0 — Registers (run the day)

    Tag `registers`. A register is one block-session (a block + a date).
    **Who's expected** comes from the bookings holding a place (Confirmed /
    Approval needed) on that block; the register only stores what happened on
    the day — check-in / check-out / absent, per booking ref, stamped with
    who marked it and when.

    - `GET /api/registers?date=YYYY-MM-DD` (default today) — every session
      the tenant runs that day, attendees merged with attendance, plus
      `counts` (expected/in/out/absent). Staff can read; platform passes
      `?tenantId=`; parents 403.
    - `POST /api/registers/{blockId}/{date}/mark` `{ref, status}` —
      `in` | `out` (keeps the check-in time) | `absent` | `expected` (undo,
      clears the entry). **This is the one write the `staff` role has** —
      taking attendance is their job. Operators can mark too; platform and
      parents cannot. Marking a booking that doesn't hold a place is a 409.
    - Realtime collection `registers` (tenant-scoped) — two devices marking
      the same session stay in sync live.

    ## v0.6.0 — Listings persist the WHOLE builder draft

    Answers to the listings handoff's §0, now live:

    1. **Saving a listing generates dated `blocks` — yes.** The run recipe
       (`runFrom` / `runTo` / `blockMode` / `days` / `datesOff`) is turned into
       real dated runs on every create/update: weekly mode makes one block per
       calendar week, `custom` one block for the range. Generated blocks carry
       `auto: true`; blocks made by hand via `POST /api/blocks` are never
       touched. Re-saving *updates* matching blocks in place (`bookedCount`
       and open/closed survive); runs that leave the recipe are deleted when
       empty, closed when booked. No client ever creates blocks for a listing.
    2. **Free-text `dates` is therefore moot** — parent bookings always attach
       to a `blockId`, so capacity + waitlist are always enforced.
    3. **Capacity lives on the generated blocks**, sourced from
       `maxAttendees` (blank = effectively unlimited). `capacityScope` is
       stored; both scopes enforce per block for now (per-session counts are a
       later refinement).
    4. **"Take a booking" belongs in Bookings**, writing through
       `POST /api/bookings` as it stands. The operator-typed `amount` is the
       operator's authorised price (their explicit override); PARENT bookings
       never send an amount — see below.

    Also new:

    - `POST /api/listings` / `PUT` accept the **entire wizard draft**
      (title, images, sections, run recipe, capacity, policy, discounts,
      `pageStyle`…) and store it verbatim — the listing doc IS the draft.
      `name` mirrors `title`; `passes` stays the priced-tickets snapshot.
    - **`visibility` is enforced**: the browse feed (`GET /api/listings`)
      returns only `status: live`, `visibility: public`, unarchived listings.
      `hidden` = *unlisted*: excluded from the feed but fully readable and
      bookable via the new **`GET /api/listings/{id}`** (the direct link).
      Foreign drafts/archived 404 there; your own tenant sees everything.
    - `GET /api/listings/{id}` **embeds** what the customer page needs:
      `blocks` (dated runs + availability), `bundle` (the block bundle's
      server-resolved passes/timings/periods) and `library` (the venue,
      add-ons, staff and categories the listing references).
    - **`opensAt` is enforced server-side**: parent bookings before it are
      rejected `409` with `opensAt` in the body (show the countdown).
      Draft/archived listings also can't be booked (`409`).
    - **Parent booking prices are fully server-computed**: the pass price
      with the listing's automatic `discounts` applied (multi-person →
      multi-session → early-bird, best rule wins — the same shared engine
      the builder previews, `features/listings/discounts.ts`).
    - **Tenant library** (`GET`/`PUT /api/library`): the shared option lists
      (categories, venues, provided/safety/SEND/outcomes, add-ons, staff)
      that were browser-localStorage. One object per tenant, realtime
      collection name `library`.
    - **Image uploads** (`POST /api/uploads` → `{url}`; public
      `GET /api/images/{id}`): listing/library images must be uploaded
      first — data URLs inside listing docs are rejected (Firestore's 1MB
      doc limit).
    - "Send to listings" pass snapshots now include `days` (session count),
      which discount thresholds use.
    - `DELETE /api/listings/{id}` cascades the listing's empty blocks and
      409s when any block has bookings (archive instead).

    ## v0.5.0 — Blocks BUILDER (periods / passes / bundles)

    New, separate from the dated-run `blocks` model: reusable scheduling
    patterns kept in a per-tenant library. **Periods** (named time windows),
    **Passes** (booking lengths in days) and **Block bundles** (periods +
    passes + the pricing calculator). Endpoints under `/api/periods`,
    `/api/passes`, `/api/block-bundles` (tag `blocks-builder`).

    Pricing is resolved **server-side** (single master price → per-day →
    per-pass → per-timing, every value overridable); each bundle response
    carries a computed `resolved` object — render it, never re-derive it
    client-side. **"Send to listings"** (`PUT /api/block-bundles/{id}/listings`)
    associates the bundle AND snapshots the resolved pass prices into each
    listing's `passes`, which is what checkout prices from. It does NOT
    create dated runs — that remains `POST /api/blocks`. Deleting a period
    or pass cascades: its id is stripped from every bundle.

    ## ⚠ v0.4.0 breaking changes (Blocks & sessions)

    - `listing.blocks` is no longer `string[]` — it's an array of **Block**
      objects with `id`, availability (`spotsLeft`, `capacity`, `open`) and
      per-day `sessions`, joined from the new blocks collection.
    - `POST /api/my/bookings` takes `blockId` instead of `dates`.
    - `POST /api/listings` / `PUT` no longer accept a `blocks` field — blocks
      are managed via the new `/api/blocks` endpoints.
    - **Capacity is enforced**: booking a full/closed block creates the
      booking as `Waitlisted` (not an error). Confirmed and
      Approval-needed bookings hold places; cancelling/declining frees
      them; `promote` seats a waitlisted booking (may overbook — that's
      the operator's explicit call).

    ## Authentication

    Every `/api/*` endpoint (except the invite preview) requires a
    **Firebase ID token**:

    ```
    Authorization: Bearer <idToken>
    ```

    Get a token by signing in a Firebase user (Email/Password provider):

    - **From a web app** — Firebase JS SDK:
      `signInWithEmailAndPassword(auth, email, password)` then
      `await user.getIdToken()`.
    - **From curl/Postman** (for testing):
      ```
      POST https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=<WEB_API_KEY>
      { "email": "...", "password": "...", "returnSecureToken": true }
      ```
      → use the `idToken` from the response. Tokens expire after 1 hour.

    ## Tenancy & roles (server-enforced)

    Every provider is a **tenant** with fully isolated data. The API derives
    the caller's scope from the authenticated account — **there is no
    tenant/portal parameter for operators to choose**; sending someone
    else's ref simply yields 404.

    | Role | How it's created | Bookings scope | Write? |
    | --- | --- | --- | --- |
    | `platform` | set-role CLI | any tenant (`?tenantId=` filter) | no (read-only) |
    | `company` | signup (creates its tenant) | whole own tenant, incl. franchises | yes |
    | `freelancer` | signup (creates its tenant) | whole own tenant | yes |
    | `franchise` | invite link from a company | own franchise subset only | yes |
    | `staff` | invite link from an operator | own tenant | no (read-only) |
    | `parent` | signup | none — `/api/my/*` by token email | own bookings |

    Account type is chosen ONCE (`POST /api/register-role` or invite accept);
    afterwards only the `set-role` CLI can change it.

    ## Notes for UI builders

    - `answers` is an array of `[question, answer]` string pairs (tuples).
    - Mutations return the **full updated booking** — replace your local copy.
    - Prices are **server-side**: parents pick a listing + pass; the API
      resolves the amount.
    - `GET /api/me` tells you who the account is (role, tenant) — use it to
      route to the right portal after sign-in.
    - **Transactional emails are sent** to the booker on: booking created
      (request-received for parents, payment-link for operator-taken
      bookings), approve/promote, decline, refund-approve, and the `resend`
      action. Without SMTP configured they go to a dev preview inbox
      (URLs in the API log). Invite links are still shared manually.
    - Payments (Stripe / Tax-Free Childcare) come in a later milestone —
      parent bookings are created `Approval needed` / `Unpaid` and the
      payment-link button in emails is a placeholder.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: bookings
    description: Operator bookings, scoped to the caller's tenant
  - name: my
    description: The signed-in parent's own bookings
  - name: listings
    description: Listings store the whole builder draft; the run recipe generates dated blocks
  - name: library
    description: The tenant's shared listing option lists (venues, add-ons, staff…)
  - name: uploads
    description: Image storage — upload first, store the returned URL
  - name: blocks
    description: A listing's bookable runs — capacity, sessions, waitlist
  - name: blocks-builder
    description: Reusable periods / passes / bundles library with server-side pricing
  - name: registers
    description: Daily attendance per block-session — the staff role's one write
  - name: customers
    description: Operator-only, tenant-scoped
  - name: invites
    description: How franchises and staff join a tenant
  - name: tenants
  - name: meta

security:
  - firebaseIdToken: []

paths:
  /health:
    get:
      tags: [meta]
      summary: Liveness check (no auth)
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /api/events:
    get:
      tags: [meta]
      summary: Realtime invalidation stream (SSE)
      description: |
        Server-Sent Events. Because `EventSource` can't set headers, pass the
        Firebase ID token as `?token=`. Emits `data: {"collection":"…"}`
        whenever something within the caller's scope changes
        (`bookings` / `listings` / `customers` / `invites` / `children` /
        `tenants` — scoped by role and tenant exactly like the REST access).
        No data flows through this channel — on an event, refetch the
        relevant endpoint. Reconnect with a fresh token on error (tokens
        expire hourly). Includes `:ping` heartbeats every 25s.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream of invalidation events
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/me:
    get:
      tags: [meta]
      summary: Who am I
      responses:
        "200":
          description: The signed-in account's role and tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string, nullable: true }
                  role: { $ref: "#/components/schemas/Role" }
                  tenantId: { type: string, nullable: true }
                  tenantName: { type: string, nullable: true }
                  franchiseId: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/register-role:
    post:
      tags: [meta]
      summary: Provision this account (once, at signup)
      description: |
        `{role: "parent"}` → parent account.
        `{role: "company"|"freelancer", businessName}` → **creates the
        tenant** and links the account as its owner.
        Locked after the first successful call (**409** afterwards).
        `franchise`/`staff` cannot self-register — they join via invites.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [role]
                  properties:
                    role: { type: string, enum: [parent] }
                - type: object
                  required: [role, businessName]
                  properties:
                    role: { type: string, enum: [company, freelancer] }
                    businessName: { type: string, example: Bright Kids Ltd }
      responses:
        "200":
          description: Parent account set
        "201":
          description: Operator tenant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  role: { type: string }
                  tenantId: { type: string }
                  tenantName: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Account type already set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/bookings:
    get:
      tags: [bookings]
      summary: List bookings in the caller's scope
      description: |
        company/freelancer → whole tenant; franchise → own subset; staff →
        tenant (read-only); platform → all tenants, optionally filtered.
      parameters:
        - name: tenantId
          in: query
          required: false
          description: Platform accounts only — filter to one tenant.
          schema: { type: string }
      responses:
        "200":
          description: Bookings, newest ref first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [bookings]
      summary: Take a manual booking (into the caller's own tenant/franchise)
      description: |
        Creates a **Confirmed** booking (pay `Invoice sent`, or `Funded`
        with amount 0 when `method` contains "HAF"). `ref`/`bid` come from
        the tenant's own counter. Franchise accounts' bookings are stamped
        with their `franchiseId`. Staff/platform: 403 (read-only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookingInput" }
      responses:
        "201":
          description: The created booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/bookings/bulk:
    post:
      tags: [bookings]
      summary: Apply a status action to many bookings at once
      description: Refs outside the caller's scope are silently skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refs, action]
              properties:
                refs:
                  type: array
                  minItems: 1
                  items: { type: string }
                  example: ["APF-10293", "APF-10294"]
                action:
                  type: string
                  enum: [approve, decline, waitlist, cancel]
      responses:
        "200":
          description: The updated bookings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/bookings/{ref}:
    get:
      tags: [bookings]
      summary: Get one booking in the caller's scope
      parameters:
        - $ref: "#/components/parameters/refPath"
        - name: tenantId
          in: query
          required: false
          description: Required for platform accounts (they have no tenant of their own).
          schema: { type: string }
      responses:
        "200":
          description: The booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/bookings/{ref}/actions:
    post:
      tags: [bookings]
      summary: Apply a workflow action to one booking
      description: |
        One endpoint for every single-booking mutation, discriminated by
        `type`. Runs in a Firestore transaction and returns the updated
        booking. Out-of-scope refs → 404. Read-only roles → 403.

        | `type` | Effect |
        | --- | --- |
        | `approve` | status → Confirmed |
        | `decline` | status → Declined |
        | `paid` | pay → Paid |
        | `recon` | toggles the reconciliation flag |
        | `promote` | waitlist → Confirmed (+ note) |
        | `refund-approve` | cancel.refund → approved, pay → Refunded |
        | `refund-decline` | cancel.refund → declined |
        | `resend` | no mutation — re-sends the payment-link email |
        | `cancel` | cancels whole booking, writes `cancel` record |
        | `cancel-child` | cancels one child (`ki` = index in `kids`) |
        | `cancel-day` | cancels one day for one child |
        | `change-day` | moves one booked day to another date |
        | `note` | saves the mentor note |
      parameters:
        - $ref: "#/components/parameters/refPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingAction" }
            examples:
              approve: { value: { type: approve } }
              cancelPartialRefund: { value: { type: cancel, refund: partial, amount: 50 } }
              cancelOneDay: { value: { type: cancel-day, ki: 0, date: "Tue 29 Jul" } }
              saveNote: { value: { type: note, text: "Parent called — arriving late Monday." } }
      responses:
        "200":
          description: The updated booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/my/bookings:
    get:
      tags: [my]
      summary: The signed-in parent's bookings
      description: All bookings (any provider) whose booker email matches the verified token.
      responses:
        "200":
          description: The parent's bookings, newest ref first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [my]
      summary: Book places (parent checkout — basket)
      description: |
        Takes a **basket** and creates one booking per item **in the
        listing's tenant**, atomically: the whole basket gets places or the
        whole basket waitlists together (no splitting siblings). The legacy
        single-booking body (`{listingId, blockId, pass, child, age,
        method}`) is still accepted and answers with a single Booking.

        **Every price is server-computed** — pass/timing via the bundle's
        pricing resolver, per-day add-ons from the tenant library × the
        item's chosen days, then the listing's automatic discounts across
        the basket (multi-person → multi-session → early-bird; best rule of
        each kind wins). Clients send choices, never amounts.

        `dates` picks which session days the item occupies (must belong to
        the block; at most the pass's day count; default = every session,
        capped to the pass length). Bookings store these as `days`, which
        registers use.

        Status: `bookingType: "auto"` listings seat parents immediately
        (`Confirmed`); `"manual"` creates `Approval needed`. Always
        `pay: "Unpaid"` until payments land.

        Rejected `409` when: the listing is a draft/archived; `opensAt` is
        in the future (the response body includes `opensAt` — show the
        countdown); or the block is full and the listing's waitlist is off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingId, blockId, method, items]
              properties:
                listingId: { type: string, example: lst-1 }
                blockId:
                  type: string
                  description: One of the listing's blocks. Full/closed block → whole basket Waitlisted.
                method: { type: string, enum: [Card, Tax-Free Childcare] }
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [pass, child, age]
                    properties:
                      pass: { type: string, example: 4-day pass }
                      periodId: { type: string, description: A timing from the listing's bundle (GET /:id → bundle.periods). }
                      dates:
                        type: array
                        items: { type: string }
                        description: Chosen session days (ISO), e.g. which day a 1-day pass is for.
                      child: { type: string, example: Jack J }
                      age: { type: integer, example: 8 }
                      addons:
                        type: array
                        items:
                          type: object
                          required: [id]
                          properties:
                            id: { type: string, description: Library add-on id }
                            days:
                              type: array
                              items: { type: string }
                              description: Per-day add-ons only — defaults to the item's days.
      responses:
        "201":
          description: The created bookings and the basket total (legacy body → a single Booking)
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items: { $ref: "#/components/schemas/Booking" }
                  total: { type: number }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Not open for booking (draft/archived, before opensAt, or full with waitlist off)

  /api/my/bookings/{ref}/cancel:
    post:
      tags: [my]
      summary: Request cancellation of one of my bookings
      description: |
        Parent-initiated cancellation **request**: `status: "Cancelled"`,
        `cancel.by: "Booker"`, `cancel.refund: "pending"` — the provider
        resolves it with `refund-approve`/`refund-decline`. Lookup is scoped
        to the caller's email, so another family's ref is simply 404.
      parameters:
        - $ref: "#/components/parameters/refPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                msg: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The updated booking (refund pending)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/my/children:
    get:
      tags: [my]
      summary: The signed-in parent's child profiles
      responses:
        "200":
          description: Children, sorted by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChildProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [my]
      summary: Add a child profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChildProfileInput" }
      responses:
        "201":
          description: The created child
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChildProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/my/children/{id}:
    put:
      tags: [my]
      summary: Update one of my children
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChildProfileInput" }
      responses:
        "200":
          description: The updated child
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChildProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [my]
      summary: Remove one of my children
      description: Existing bookings keep their own copy of the child's details.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/listings:
    get:
      tags: [listings]
      summary: Browse feed (public; or my tenant's listings with ?mine=1)
      security: []
      description: |
        **No auth required** — the public storefront feed: only
        `status: live`, `visibility: public`, unarchived listings, every
        tenant, with `tenantId` / `tenantName` and joined `blocks`. Hidden
        listings are *unlisted*: absent here, fully served by
        `GET /api/listings/{id}`.

        With a token and `?mine=1`: ALL of the caller's own tenant's
        listings — drafts, hidden and archived included (the operator
        management view).
      parameters:
        - name: mine
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Listings ordered by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Listing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [listings]
      summary: Create a listing in the caller's own tenant
      description: |
        Operators with write access (company/freelancer/franchise). Send the
        **whole builder draft** (see `ListingDraft`) — it is stored verbatim,
        `name` mirrors `title`, and the run recipe is turned into dated
        `blocks` automatically (see the v0.6.0 notes). Images must be
        uploaded first (`POST /api/uploads`) — data URLs are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingDraft" }
      responses:
        "201":
          description: The created listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/listings/{id}:
    get:
      tags: [listings]
      summary: One listing — the direct link (`/book/{id}` reads this)
      security: []
      description: |
        **No auth required.** Returns `hidden` listings too (hidden =
        unlisted but bookable by link). Drafts/archived 404 unless the
        caller sends a token and their tenant owns them.
        Embeds everything the customer page needs — `blocks` (dated runs +
        availability), `bundle` (the block bundle's server-resolved
        passes / timings / periods) and `library` (the venue, add-ons,
        staff and categories this listing references).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The listing with blocks, bundle and library embedded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [listings]
      summary: Update one of my tenant's listings
      description: |
        Accepts the full draft or a partial patch (e.g. just `{visibility}`
        or `{archived}`). Changing any run-recipe field re-syncs the
        generated blocks.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingDraft" }
      responses:
        "200":
          description: The updated listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Listing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [listings]
      summary: Delete one of my tenant's listings
      description: |
        Cascades the listing's (empty) blocks. 409 when any block has booked
        places — archive the listing instead. Past bookings keep their
        denormalised listing name.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The listing has bookings — archive it instead

  /api/library:
    get:
      tags: [library]
      summary: My tenant's shared listing library
      description: |
        The option lists reused across all of a tenant's listings —
        categories, venues, provided / safety / SEND / outcomes chips,
        add-ons, staff, emojis. `null` until first saved. Any member of the
        tenant may read; parents never call this (the slice a listing uses is
        embedded in `GET /api/listings/{id}`). Realtime collection:
        `library`.
      responses:
        "200":
          description: The library object, or null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [library]
      summary: Replace my tenant's library
      description: |
        Operators only. Whole-object replace. Add-on images must be uploaded
        via `POST /api/uploads` first (413 when the object is oversized).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                categories: { type: array, items: { type: object } }
                venues: { type: array, items: { type: object } }
                provided: { type: array, items: { type: string } }
                safety: { type: array, items: { type: string } }
                send: { type: array, items: { type: string } }
                outcomes: { type: array, items: { type: string } }
                addons: { type: array, items: { type: object } }
                staff: { type: array, items: { type: object } }
                emojis: { type: object }
      responses:
        "200":
          description: The stored library
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: Library too large

  /api/uploads:
    post:
      tags: [uploads]
      summary: Upload an image (operators)
      description: |
        Body `{dataUrl}` — a base64 `data:image/*` URL (the builder's
        canvas-compressed JPEGs). Returns the public URL to store in the
        listing/library. Max ~900KB decoded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataUrl]
              properties:
                dataUrl: { type: string, example: "data:image/jpeg;base64,/9j/4AAQ…" }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  url: { type: string, example: "http://localhost:4000/api/images/aB3…" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: Image too large

  /api/images/{id}:
    get:
      tags: [uploads]
      summary: Serve an uploaded image (public, no auth)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The image bytes (immutable cache headers)
        "404": { $ref: "#/components/responses/NotFound" }

  /api/blocks:
    get:
      tags: [blocks]
      summary: My tenant's blocks
      parameters:
        - name: listingId
          in: query
          required: false
          schema: { type: string }
        - name: tenantId
          in: query
          required: false
          description: Platform accounts only.
          schema: { type: string }
      responses:
        "200":
          description: Blocks sorted by start date
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Block" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [blocks]
      summary: Create a block on one of my listings
      description: |
        Provide `schedule` (sessions are generated for every matching
        weekday in the date range) **or** an explicit `sessions` array.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockInput" }
      responses:
        "201":
          description: The created block
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Block" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/blocks/{id}:
    put:
      tags: [blocks]
      summary: Update a block
      description: |
        `bookedCount` is never client-writable; a block can't move to a
        different listing. Set `open: false` to pause sales.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockInput" }
      responses:
        "200":
          description: The updated block
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Block" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [blocks]
      summary: Delete a block
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Block still has bookings holding places
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/blocks/{id}/attendees:
    get:
      tags: [blocks]
      summary: Who's booked into this block (the register foundation)
      description: Counted (Confirmed / Approval needed) and Waitlisted bookings with their children.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Block + attendees
          content:
            application/json:
              schema:
                type: object
                properties:
                  block: { $ref: "#/components/schemas/Block" }
                  attendees:
                    type: array
                    items:
                      type: object
                      properties:
                        ref: { type: string }
                        status: { type: string }
                        booker: { type: string }
                        email: { type: string }
                        seats: { type: integer }
                        children:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              age: { type: number }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/registers:
    get:
      tags: [registers]
      summary: The day's registers (default today)
      description: |
        Every session the caller's tenant runs on the date — one entry per
        block with a session that day — with expected attendees (bookings
        holding a place) merged with the attendance taken so far. Staff can
        read. Platform must pass `?tenantId=`. Parents 403.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, example: "2026-08-03" }
        - name: tenantId
          in: query
          required: false
          description: Platform accounts only
          schema: { type: string }
      responses:
        "200":
          description: Sessions ordered by start time
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RegisterSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/registers/{blockId}/{date}/mark:
    post:
      tags: [registers]
      summary: Check a child in/out, mark absent, or undo
      description: |
        The `staff` role's one write (operators can too; platform and parents
        cannot). `in` stamps the arrival time; `out` stamps departure and
        keeps the arrival; `absent` records a no-show; `expected` clears the
        entry (mis-tap undo). The booking must hold a place on the block
        (Confirmed / Approval needed) — anything else is a 409.
      parameters:
        - name: blockId
          in: path
          required: true
          schema: { type: string }
        - name: date
          in: path
          required: true
          schema: { type: string, example: "2026-08-03" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref, status]
              properties:
                ref: { type: string, example: "10312" }
                status: { type: string, enum: [in, out, absent, expected] }
      responses:
        "200":
          description: The updated entry (null after an undo)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ref: { type: string }
                  attendance:
                    $ref: "#/components/schemas/AttendanceEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The booking doesn't hold a place on this block

  /api/periods:
    get:
      tags: [blocks-builder]
      summary: My tenant's periods (platform — ?tenantId=)
      responses:
        "200":
          description: Periods sorted by start time
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Period" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [blocks-builder]
      summary: Create a period
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PeriodInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Period" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/periods/{id}:
    put:
      tags: [blocks-builder]
      summary: Update a period
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PeriodInput" }
      responses:
        "200": { description: Updated }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [blocks-builder]
      summary: Delete a period (cascades out of every bundle)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/passes:
    get:
      tags: [blocks-builder]
      summary: My tenant's passes (sorted by days DESC)
      responses:
        "200":
          description: Passes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pass" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [blocks-builder]
      summary: Create a pass
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassInput" }
      responses:
        "201": { description: Created }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/passes/{id}:
    put:
      tags: [blocks-builder]
      summary: Update a pass
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassInput" }
      responses:
        "200": { description: Updated }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [blocks-builder]
      summary: Delete a pass (cascades out of every bundle)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/block-bundles:
    get:
      tags: [blocks-builder]
      summary: The bundle library (sorted by order; includes resolved pricing)
      responses:
        "200":
          description: Bundles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BlockBundle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [blocks-builder]
      summary: Create a bundle (order auto-assigned; listingIds start empty)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockBundleInput" }
      responses:
        "201":
          description: Created (with resolved pricing)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockBundle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/block-bundles/reorder:
    post:
      tags: [blocks-builder]
      summary: Reorder the library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderedIds]
              properties:
                orderedIds:
                  type: array
                  items: { type: string }
      responses:
        "200": { description: Reordered }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/block-bundles/{id}:
    put:
      tags: [blocks-builder]
      summary: Update a bundle (listingIds/order managed via their own endpoints)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockBundleInput" }
      responses:
        "200": { description: Updated (with resolved pricing) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [blocks-builder]
      summary: Delete a bundle
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/block-bundles/{id}/duplicate:
    post:
      tags: [blocks-builder]
      summary: Duplicate a bundle ("… (copy)", listingIds cleared, appended last)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "201": { description: The copy }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/block-bundles/{id}/archive:
    post:
      tags: [blocks-builder]
      summary: Archive / unarchive
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [archived]
              properties:
                archived: { type: boolean }
      responses:
        "200": { description: Updated }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/block-bundles/{id}/listings:
    put:
      tags: [blocks-builder]
      summary: Send to listings (associate + snapshot resolved prices into listing.passes)
      description: |
        Sets the bundle's `listingIds` and, when the bundle is `priced` with
        a `masterPrice`, overwrites each target listing's `passes` with the
        RESOLVED pass prices — that's what parent checkout then charges.
        Does not create dated runs (`POST /api/blocks` does that).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingIds]
              properties:
                listingIds:
                  type: array
                  items: { type: string }
      responses:
        "200": { description: Updated bundle }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/customers:
    get:
      tags: [customers]
      summary: List the caller's tenant's customers
      parameters:
        - name: tenantId
          in: query
          required: false
          description: Platform accounts only — filter to one tenant.
          schema: { type: string }
      responses:
        "200":
          description: Customers ordered by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Customer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/invites:
    get:
      tags: [invites]
      summary: List my tenant's invites
      responses:
        "200":
          description: Invites, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invite" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [invites]
      summary: Create an invite link
      description: |
        Who may invite whom: **company** → franchise or staff;
        **franchise / freelancer** → staff only. Share the returned URL —
        the recipient signs up through it and joins the tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [franchise, staff] }
      responses:
        "201":
          description: The invite
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  url: { type: string, example: /signup?invite=abc123 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/invites/{token}:
    get:
      tags: [invites]
      summary: Preview an invite (no auth — the token is the secret)
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: What the invite is for
          content:
            application/json:
              schema:
                type: object
                properties:
                  role: { type: string, enum: [franchise, staff] }
                  tenantName: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: Invite already used
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/invites/{token}/accept:
    post:
      tags: [invites]
      summary: Join the tenant (after creating an account)
      description: |
        Sets the account's role + tenant from the invite and burns the
        token. 409 if the account already has a type.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                type: object
                properties:
                  role: { type: string }
                  tenantId: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Account type already set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Invite already used
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/platform/overview:
    get:
      tags: [tenants]
      summary: Platform-wide aggregates for the HQ dashboard (platform role only)
      responses:
        "200":
          description: Live totals across every tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants:
                    type: object
                    properties:
                      total: { type: integer }
                      byType:
                        type: object
                        properties:
                          company: { type: integer }
                          freelancer: { type: integer }
                      recent:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            type: { type: string }
                            createdAt: { type: string }
                  bookings:
                    type: object
                    properties:
                      total: { type: integer }
                      byStatus:
                        type: object
                        additionalProperties: { type: integer }
                      bookedValue: { type: number }
                      paidValue: { type: number }
                      refundsPending: { type: integer }
                  listings:
                    type: object
                    properties:
                      total: { type: integer }
                  accounts:
                    type: object
                    properties:
                      total: { type: integer }
                      byRole:
                        type: object
                        additionalProperties: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/tenants:
    get:
      tags: [tenants]
      summary: List every provider (platform role only)
      responses:
        "200":
          description: Tenants, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    type: { type: string, enum: [company, freelancer] }
                    createdAt: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    firebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token (see the Authentication section above).

  parameters:
    refPath:
      name: ref
      in: path
      required: true
      description: Booking reference, e.g. `APF-10293`.
      schema: { type: string }

  responses:
    BadRequest:
      description: Validation failed (`error` is a message or zod issue list)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing/invalid Firebase ID token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The account's role/tenant doesn't allow this
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found (or outside the caller's tenant scope)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Role:
      type: string
      enum: [platform, company, franchise, freelancer, staff, parent]

    Error:
      type: object
      properties:
        error:
          description: Human-readable message, or an array of zod issues on 400.
          oneOf:
            - type: string
            - type: array
              items: { type: object }

    Kid:
      type: object
      required: [name]
      properties:
        name: { type: string }
        age: { type: number }
        dob: { type: string, example: "14/03/2018" }
        dates:
          type: array
          items: { type: string }
          description: Booked days, e.g. "Mon 28 Jul".
        cancelledDays:
          type: array
          items: { type: string }
        cancelled: { type: boolean }

    CancelInfo:
      type: object
      required: [on, by]
      properties:
        on: { type: string, example: "10/07/2026, 15:07" }
        by: { type: string, example: Provider }
        msg: { type: string }
        refund:
          type: string
          enum: [full, partial, none, approved, declined, pending]
        amount: { type: number }
        refundOnly:
          type: boolean
          description: true when the booking was already in the past.

    RefundLogEntry:
      type: object
      required: [label, amount, on, by]
      properties:
        label: { type: string, example: "Jack J — Tue 29 Jul" }
        amount: { type: number }
        on: { type: string }
        by: { type: string }
        source: { type: string }

    Booking:
      type: object
      required: [ref, bid, booker, email, listing, status, pay, amount]
      properties:
        ref: { type: string, example: APF-10293 }
        bid: { type: string, example: "0307293" }
        tenantId: { type: string, description: The provider this booking belongs to. }
        franchiseId:
          type: string
          description: Set when the booking belongs to a franchise within the tenant.
        blockId:
          type: string
          description: The block this booking holds places in.
        seats:
          type: integer
          description: Places held in the block (default 1).
        booker: { type: string, example: Sarah Jones }
        email: { type: string, example: sarah.j@email.com }
        phone: { type: string }
        child:
          type: string
          description: Primary child name (multi-child bookings use `kids`).
        age: { type: number }
        dob: { type: string }
        kids:
          type: array
          items: { $ref: "#/components/schemas/Kid" }
        listing: { type: string, example: Summer Holiday Camp 2027 }
        pass: { type: string, example: 5-day week pass }
        ticket: { type: string }
        dates: { type: string, example: 28 Jul – 1 Aug }
        sessions:
          type: array
          items: { type: string, example: "Mon 28 Jul 2027 · 09:00 – 17:30" }
        status:
          type: string
          enum: [Approval needed, Confirmed, Waitlisted, Cancelled, Declined]
        pay:
          type: string
          description: Paid / Unpaid / Invoice sent / Refunded / Partially refunded / Funded.
        method: { type: string, example: Card }
        amount: { type: number, example: 540 }
        addons:
          type: array
          items: { type: string }
        answers:
          type: array
          description: Checkout Q&A as [question, answer] string pairs.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: string }
        note: { type: string }
        recon: { type: boolean, nullable: true }
        evid: { type: string, nullable: true }
        cancel:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/CancelInfo" }]
        past: { type: boolean }
        refundLog:
          type: array
          items: { $ref: "#/components/schemas/RefundLogEntry" }

    CreateBookingInput:
      type: object
      required: [booker, email, child, age, listing, pass, amount, method]
      description: Provide `blockId` (capacity/waitlist apply, sessions derived) OR a free-text `dates` label.
      properties:
        booker: { type: string, example: Test Parent }
        email: { type: string, example: tp@test.com }
        child: { type: string, example: Kid T }
        age: { type: number, example: 7 }
        listing: { type: string, example: Easter Football Camp }
        pass: { type: string, example: 4-day pass }
        blockId: { type: string }
        dates: { type: string, example: "Week 1 · 7 – 10 Apr 2027" }
        amount: { type: number, example: 120 }
        method:
          type: string
          example: Card
          description: Contains "HAF" → booking becomes Funded with amount 0.

    BookingAction:
      oneOf:
        - title: Status / pay / recon transition
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [approve, decline, paid, recon, promote, refund-approve, refund-decline, resend]
        - title: Cancel booking
          type: object
          required: [type, refund]
          properties:
            type: { type: string, enum: [cancel] }
            refund: { type: string, enum: [full, partial, none] }
            amount: { type: number }
        - title: Cancel one child
          type: object
          required: [type, ki]
          properties:
            type: { type: string, enum: [cancel-child] }
            ki: { type: integer }
        - title: Cancel one day
          type: object
          required: [type, ki, date]
          properties:
            type: { type: string, enum: [cancel-day] }
            ki: { type: integer }
            date: { type: string }
        - title: Move a day
          type: object
          required: [type, ki, oldDate, newDate]
          properties:
            type: { type: string, enum: [change-day] }
            ki: { type: integer }
            oldDate: { type: string }
            newDate: { type: string }
        - title: Save note
          type: object
          required: [type, text]
          properties:
            type: { type: string, enum: [note] }
            text: { type: string }
      discriminator:
        propertyName: type

    Session:
      type: object
      required: [date, start, end]
      properties:
        date: { type: string, example: "2027-07-28" }
        start: { type: string, example: "09:00" }
        end: { type: string, example: "15:30" }

    Block:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: "Week 1 · 28 Jul – 1 Aug 2027" }
        startDate: { type: string, example: "2027-07-28" }
        endDate: { type: string, example: "2027-08-01" }
        capacity: { type: integer, example: 24 }
        bookedCount: { type: integer, example: 21 }
        spotsLeft: { type: integer, example: 3 }
        open: { type: boolean }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/Session" }

    BlockInput:
      type: object
      required: [listingId, name, startDate, endDate, capacity]
      properties:
        listingId: { type: string }
        name: { type: string, example: "Week 1 · 28 Jul – 1 Aug 2027" }
        startDate: { type: string, example: "2027-07-28" }
        endDate: { type: string, example: "2027-08-01" }
        capacity: { type: integer, minimum: 1 }
        open: { type: boolean, default: true }
        schedule:
          type: object
          description: Sessions are generated from this across the date range.
          properties:
            startTime: { type: string, example: "09:00" }
            endTime: { type: string, example: "15:30" }
            weekdays:
              type: array
              description: 0=Sun … 6=Sat; defaults to Mon–Fri.
              items: { type: integer, minimum: 0, maximum: 6 }
        sessions:
          type: array
          description: Explicit sessions (alternative to schedule).
          items: { $ref: "#/components/schemas/Session" }

    PeriodInput:
      type: object
      required: [title, start, finish]
      properties:
        title: { type: string, example: Early drop-off }
        start: { type: string, example: "08:00" }
        finish: { type: string, example: "09:00" }

    Period:
      allOf:
        - $ref: "#/components/schemas/PeriodInput"
        - type: object
          properties:
            id: { type: string }
            tenantId: { type: string }

    PassInput:
      type: object
      required: [name, days]
      properties:
        name: { type: string, example: 5-day week pass }
        days: { type: integer, example: 5 }

    Pass:
      allOf:
        - $ref: "#/components/schemas/PassInput"
        - type: object
          properties:
            id: { type: string }
            tenantId: { type: string }

    BlockBundleInput:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Summer Multi-Activity Camp }
        periodIds:
          type: array
          items: { type: string }
        passIds:
          type: array
          items: { type: string }
        archived: { type: boolean, default: false }
        priced: { type: boolean, default: false }
        masterPrice: { type: number, nullable: true, description: Full price of the LONGEST pass. }
        calcOn: { type: boolean, default: true }
        passFlat:
          type: object
          additionalProperties: { type: number }
          description: passId → flat price override
        passMode:
          type: object
          additionalProperties: { type: string, enum: [flat] }
        periodPrice:
          type: object
          additionalProperties: { type: number }
          description: '"{passId}_{periodId}" → per-timing override'

    BlockBundle:
      allOf:
        - $ref: "#/components/schemas/BlockBundleInput"
        - type: object
          properties:
            id: { type: string }
            tenantId: { type: string }
            listingIds:
              type: array
              items: { type: string }
            order: { type: integer }
            resolved:
              type: object
              description: Server-computed pricing — render this, never re-derive.
              properties:
                perDay: { type: number }
                passes:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      days: { type: integer }
                      price: { type: number }
                timings:
                  type: object
                  additionalProperties: { type: number }
                  description: '"{passId}_{periodId}" → price'

    ListingDraft:
      type: object
      description: |
        The builder's draft, stored verbatim (`WizardDraft` in
        features/listings/ListingWizard.tsx is the source of truth for the
        full field list — unknown fields are stripped, so extend the server
        schema when the builder grows a new one). Creating requires `title`
        or `name`; updates may be partial. The run-recipe fields
        (`runFrom`, `runTo`, `blockMode`, `days`, `datesOff`,
        `maxAttendees`, `blockId`) generate/re-sync the dated blocks.
      properties:
        title: { type: string, example: Summer Holiday Camp }
        name: { type: string, description: Mirrors title; legacy clients may send it alone. }
        passes:
          type: array
          description: Priced-tickets snapshot (written by the bundle's "send to listings").
          items:
            type: object
            required: [name, price]
            properties:
              name: { type: string, example: 4-day pass }
              price: { type: number, example: 160 }
              days: { type: number, example: 4, description: Session count — discount thresholds use it. }
        images:
          type: array
          items:
            type: object
            properties:
              src: { type: string, description: "URL from POST /api/uploads — data URLs are rejected." }
              x: { type: number }
              y: { type: number }
              zoom: { type: number }
        description: { type: string }
        runFrom: { type: string, example: "2026-08-03" }
        runTo: { type: string, example: "2026-08-14" }
        blockMode: { type: string, enum: [weekly, custom] }
        days: { type: array, items: { type: integer }, description: "Weekdays 0=Sun … 6=Sat" }
        datesOff: { type: array, items: { type: string } }
        maxAttendees: { type: string, example: "24" }
        capacityScope: { type: string, enum: [day, listing] }
        blockId: { type: string, nullable: true, description: The block bundle whose periods time the sessions. }
        visibility: { type: string, enum: [public, hidden] }
        opensAt: { type: string, example: "2026-08-01T09:00", description: Booking held until then (server-enforced). }
        status: { type: string, enum: [draft, live] }
        archived: { type: boolean }
        waitlist: { type: boolean }
        pageStyle: { type: string, enum: [playful, sport, navy] }
        discounts:
          type: array
          description: Automatic discount rules (see features/listings/discounts.ts).
          items: { type: object }

    Listing:
      allOf:
        - $ref: "#/components/schemas/ListingDraft"
        - type: object
          properties:
            id: { type: string, example: lst-1 }
            tenantId: { type: string, example: apf-demo }
            tenantName: { type: string, example: APF Activity Camps }
            blocks:
              type: array
              description: Joined from the blocks collection (read-only — generated from the run recipe).
              items: { $ref: "#/components/schemas/Block" }

    ListingDetail:
      allOf:
        - $ref: "#/components/schemas/Listing"
        - type: object
          properties:
            bundle:
              type: object
              nullable: true
              description: The listing's block bundle, server-priced.
              properties:
                id: { type: string }
                name: { type: string }
                passes:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      days: { type: number }
                      price: { type: number }
                timings:
                  type: object
                  description: '"{passId}_{periodId}" → price'
                periods:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      title: { type: string }
                      start: { type: string, example: "09:00" }
                      finish: { type: string, example: "15:30" }
            library:
              type: object
              description: The slice of the tenant library this listing references.
              properties:
                venue: { type: object, nullable: true }
                addons: { type: array, items: { type: object } }
                staff: { type: array, items: { type: object } }
                categories: { type: array, items: { type: object } }

    AttendanceEntry:
      type: object
      nullable: true
      properties:
        status: { type: string, enum: [in, out, absent] }
        inAt: { type: string, nullable: true, example: "2026-08-03T08:52:11.000Z" }
        outAt: { type: string, nullable: true }
        by: { type: string, description: Who marked it (email/uid) }
        at: { type: string, description: When the entry last changed }

    RegisterSession:
      type: object
      properties:
        blockId: { type: string }
        date: { type: string, example: "2026-08-03" }
        start: { type: string, example: "09:00" }
        end: { type: string, example: "15:30" }
        blockName: { type: string, example: "Week 1 · 3 – 7 Aug 2026" }
        listingId: { type: string }
        listingName: { type: string }
        attendees:
          type: array
          items:
            type: object
            properties:
              ref: { type: string }
              booker: { type: string }
              bookingStatus: { type: string }
              seats: { type: number }
              children:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    age: { type: number }
              attendance: { $ref: "#/components/schemas/AttendanceEntry" }
        counts:
          type: object
          properties:
            expected: { type: integer }
            in: { type: integer }
            out: { type: integer }
            absent: { type: integer }

    Customer:
      type: object
      properties:
        id: { type: string, example: cust-1 }
        tenantId: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        children:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              age: { type: number }
              dob: { type: string }

    ChildProfileInput:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Zara }
        age:
          type: integer
          minimum: 0
          maximum: 17
          description: Derived from dob server-side when omitted.
        dob: { type: string, example: 14 Mar 2018 }
        school: { type: string, example: Riverside Primary }
        allergies: { type: string, example: nut allergy }
        medical: { type: string, example: asthma }
        send: { type: string, description: SEND / accessibility needs }
        photoConsent:
          type: boolean
          default: false
          description: Safeguarding — may the child appear in photos (Moments/newsfeed)? Defaults to NO.
        photo:
          type: string
          description: Small avatar as a data:image/* URL (client-resized; interim until file storage).

    ChildProfile:
      allOf:
        - $ref: "#/components/schemas/ChildProfileInput"
        - type: object
          properties:
            id: { type: string }
            parentUid: { type: string }

    Invite:
      type: object
      properties:
        token: { type: string }
        role: { type: string, enum: [franchise, staff] }
        createdAt: { type: string }
        usedBy: { type: string, nullable: true }
