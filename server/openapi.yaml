        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/subscription:
    get:
      tags: [subscription]
      summary: The tenant's current plan + the catalogue
      parameters: [{ name: tenantId, in: query, required: false, description: Platform only, schema: { type: string } }]
      responses:
        "200": { description: "{current (incl. card + snapshot price/limits), plans[], billingConfigured}" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [subscription]
      summary: Choose or change a plan (live Stripe sub → prorated price swap)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { type: string, enum: [freelancer, company, franchise] }
                band: { type: string }
                cadence: { type: string, enum: [month, year] }
      responses:
        "200": { description: "{current, plans[], billingConfigured}" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/subscription/checkout:
    post:
      tags: [subscription]
      summary: Card capture — a Stripe SetupIntent for the client's PaymentElement
      description: No charge here; the card attaches to the tenant's Stripe Customer. 503 when Stripe isn't configured.
      responses:
        "200": { description: "{clientSecret}" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/subscription/start:
    post:
      tags: [subscription]
      summary: Create the real Stripe subscription off the captured card
      description: >
        First-ever start gets the 7-day trial (card auto-charged on day 7);
        a lapsed tenant restarting is charged immediately, no second trial.
        Price, limits and metering rates are snapshotted from the live
        catalogue onto the tenant (grandfathering — later HQ pricing edits
        never move an existing subscriber). Annual cadence bills 10 months.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, setupIntentId]
              properties:
                plan: { type: string, enum: [freelancer, company, franchise] }
                band: { type: string }
                cadence: { type: string, enum: [month, year] }
                setupIntentId: { type: string }
      responses:
        "200": { description: "{ok, status, current}" }
        "400": { description: Card not confirmed, or malformed body }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/subscription/cancel:
    post:
      tags: [subscription]
      summary: Cancel at period end — access continues until then, no refund
      responses:
        "200": { description: "{ok, status:'canceling', cancelAt}" }
        "400": { description: No active subscription }

  /api/subscription/reactivate:
    post:
      tags: [subscription]
      summary: Un-cancel (still in period), or re-subscribe off the saved card
      responses:
        "200": { description: "{ok, status}" }
        "402": { description: No usable saved card — run /checkout + /start instead }

  /api/platform/leads:
    get:
      tags: [platform-hq]
      summary: All sales leads (embedded activities, newest-updated first)
      responses: { "200": { description: Array of leads }, "403": { $ref: "#/components/responses/Forbidden" } }
    post:
      tags: [platform-hq]
      summary: Create a lead
      description: "Enums: source cold_call|email|social|referral|event|inbound; plan freelancer|company|franchise; stage new|contacted|interested|demo|trial|won|lost. Server stamps createdAt/updatedAt/createdBy. GET /api/platform/leads/{id} returns one lead (the in-portal call page); PUT /api/platform/leads/{id} updates/moves stage; DELETE removes; POST /{id}/activities appends {type,note,outcome?} (server stamps at/by); POST /bulk imports an array, deduped by email, returns {added,skipped}. On signup, register-role auto-converts a matching open lead (email OR phone digits OR business name) to stage won with a \"Signed up 🎉\" activity."
      responses: { "201": { description: The created lead }, "400": { $ref: "#/components/responses/BadRequest" }, "403": { $ref: "#/components/responses/Forbidden" } }

  /api/platform/support:
    get:
      tags: [platform-hq]
      summary: The HQ inbox — provider + customer threads, bugs included
      responses: { "200": { description: "{threads} — embedded messages, report block on bug threads" }, "403": { $ref: "#/components/responses/Forbidden" } }
    post:
      tags: [platform-hq]
      summary: HQ starts a thread with a provider or customer
      description: "{party, providerId?, name, email, subject, body} — tier/providerName resolved from the tenant (franchise-aware via subscription.plan). POST /{id}/messages appends an HQ reply; PUT /{id} takes {status: open|resolved} and/or {read:true} (clears unreadByHq)."
      responses: { "201": { description: The created thread }, "403": { $ref: "#/components/responses/Forbidden" } }

  /api/support/report:
    post:
      tags: [platform-hq]
      summary: In-app bug report (any signed-in account — the 🐞 in the header)
      description: "{page, steps, severity: low|medium|high, device, providerId?}. Operators file as their tenant; parents as customers linked to providerId (or their latest booking's provider). Lands in the HQ inbox as a kind:\"bug\" thread with the report block, unread."
      responses: { "201": { description: "{id}" }, "400": { $ref: "#/components/responses/BadRequest" } }

  /api/stripe/webhook:
    post:
      tags: [subscription]
      summary: Stripe Billing webhook (signature-verified, raw body)
      description: >
        Keeps tenant records in lock-step with Stripe — subscription
        updates/deletion, invoice payment success/failure (→ past_due +
        team notification), trial-ending notice. The 6-hourly
        subscription-sync sweep backstops missed deliveries. Requires
        STRIPE_WEBHOOK_SECRET. Note for the lapsed: the API enforces the
        wall server-side — canceled/past_due tenants get 402 on everything
        except the subscription/account endpoints that let them fix it.
      responses:
        "200": { description: "{received:true}" }
        "400": { description: Bad signature }

  /api/posts:
    get:
      tags: [posts]
      summary: The newsfeed — operator sees the tenant's; parent sees booked providers'
      responses:
        "200": { description: Array of posts (newest first) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [posts]
      summary: Post an update to all the tenant's families (operators + staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                title: { type: string }
                body: { type: string }
                photoUrl: { type: string, description: "via /api/uploads" }
      responses:
        "201": { description: The created post }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/posts/{id}:
    delete:
      tags: [posts]
      summary: Delete a post (operators only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ok:true}" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/messages/threads:
    get:
      tags: [messages]
      summary: The caller's conversations, newest activity first (with unread counts)
      responses:
        "200": { description: Array of threads }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/messages/threads/{id}:
    get:
      tags: [messages]
      summary: A conversation's messages; marks the caller's side read
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{thread, messages[]}" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/messages:
    post:
      tags: [messages]
      summary: Send a message (creates the thread if needed) — booking-gated
      description: >
        Operator body `{parentEmail, parentName?, body}` (the family must be a
        customer, else 400). Parent body `{tenantId, body}` (must have booked
        that provider, else 403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                parentEmail: { type: string, description: "operator only" }
                parentName: { type: string, description: "operator only" }
                tenantId: { type: string, description: "parent only" }
      responses:
        "201": { description: "The created message (+ threadId)" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/my/providers:
    get:
      tags: [my]
      summary: The providers (tenantId + name) the signed-in parent has booked
      responses:
        "200": { description: "Array of {tenantId, name}" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/timetables:
    get:
      tags: [timetables]
      summary: The tenant's timetables (drafts + published state; staff and operators)
      responses:
        "200": { description: Array of timetable docs, newest updated first }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [timetables]
      summary: Save a new timetable draft (operators)
      description: >-
        Body carries the whole built state: `{listingId?, name, dateFrom,
        dateTo, excluded[], config{start,end,perDay,breaks,lunch,signin[],
        signout[],wholeTimes[],groups[]}, dayList[{n,d,iso}], plan (rows per
        day), mode}`. The activity catalog itself lives on the tenant
        library (`PUT /api/library` key `timetable`).
      responses:
        "201": { description: The created timetable }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/timetables/{id}:
    put:
      tags: [timetables]
      summary: Update a draft (same body as create; leaves `published` untouched)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The updated timetable }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [timetables]
      summary: Delete a timetable (operators)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ok:true}" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/timetables/{id}/publish:
    post:
      tags: [timetables]
      summary: Publish the current draft to audiences (or unpublish)
      description: >-
        `{staff, parents, audience}` — freezes a copy of the draft that
        audiences read, so later edits stay invisible until re-published.
        `audience: "booked"` shows parents only the days their family has
        booked; `"everyone"` shows the whole run. Both flags false =
        unpublish.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staff, parents]
              properties:
                staff: { type: boolean }
                parents: { type: boolean }
                audience: { type: string, enum: [booked, everyone], default: booked }
      responses:
        "200": { description: The timetable with its new published snapshot }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/timetables/published:
    get:
      tags: [timetables]
      summary: Published day plans the caller may see
      description: >-
        Staff → their tenant's weeks published to the Staff portal.
        Operators → everything their tenant has published. Parents → weeks
        published to Parents by providers they've booked with; with
        `audience: "booked"` each week is trimmed to that family's booked
        days (empty weeks dropped) and rows carry `tenantName`.
      responses:
        "200": { description: Array of published snapshots }

  /api/tasks:
    get:
      tags: [tasks]
      summary: The team's to-do list (open-first, then priority, then due date)
      responses:
        "200": { description: Array of tasks }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [tasks]
      summary: Add a task (staff + operators)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                notes: { type: string }
                assignee: { type: string }
                dueDate: { type: string, description: "ISO date" }
                priority: { type: string, enum: [low, normal, high], default: normal }
      responses:
        "201": { description: The created task }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/tasks/{id}:
    put:
      tags: [tasks]
      summary: Edit / tick a task (setting done toggles completedAt)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                notes: { type: string }
                assignee: { type: string }
                dueDate: { type: string }
                priority: { type: string, enum: [low, normal, high] }
                done: { type: boolean }
      responses:
        "200": { description: The updated task }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [tasks]
      summary: Delete a task (operators only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ok:true}" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/trips:
    get:
      tags: [trips]
      summary: Trips & visits (newest first)
      responses:
        "200": { description: Array of trips }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [trips]
      summary: Plan a trip (staff + operators)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination, date]
              properties:
                destination: { type: string }
                date: { type: string, description: "ISO date" }
                departTime: { type: string }
                returnTime: { type: string }
                listingId: { type: string }
                transport: { type: string }
                childNames: { type: array, items: { type: string } }
                staff: { type: array, items: { type: string } }
                headcount: { type: integer, description: "Defaults to childNames length" }
                riskAssessment: { type: string }
                consentObtained: { type: boolean, default: false }
                notes: { type: string }
                status: { type: string, enum: [planned, completed, cancelled], default: planned }
      responses:
        "201": { description: The created trip }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/trips/{id}:
    put:
      tags: [trips]
      summary: Edit a trip (staff + operators)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: The updated trip }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [trips]
      summary: Delete a trip (operators only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ok:true}" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/trips/{id}/send-message:
    post:
      tags: [trips]
      summary: Step 8 — send the parent message to every attending family
      description: >
        Emails + bells each attending child's family with the trip's stored
        parentMsg (or a {message} override). Merge tokens {destination} {date}
        {depart} {return} {transport} {cost} {payBy} {child} are resolved
        server-side; {child} personalises per family. Declined children are
        skipped. Stamps parentMsgSentAt + attendees[].sent.
        Consent requests themselves are automatic: saving a trip with newly
        added children notifies their families (Setup → Trips notifyParent),
        childNames are resolved to childId server-side, and the
        trip-consent-chase sweep re-nudges pending families daily until the
        trip date. With Setup → requireConsent on, PUT status:"completed" is
        refused (409) while any attending child's consent is pending.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { message: { type: string, maxLength: 4000 } }
      responses:
        "200": { description: "{ok, sent}" }
        "400": { description: No parent message written yet }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/my/trips:
    get:
      tags: [my]
      summary: The family's trips — every trip a child of theirs is on
      description: Upcoming + the last 30 days, with per-child consent state. Cancelled trips are hidden.
      responses:
        "200": { description: "Array of {id, provider, destination, date, times, transport, cost, payBy, status, askConsent, children:[{childId,name,consent,consentAt}]}" }

  /api/my/trips/{id}/consent:
    post:
      tags: [my]
      summary: Give or decline consent for one of their children (timestamped)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [childId, decision]
              properties:
                childId: { type: string }
                decision: { type: string, enum: [granted, declined] }
      responses:
        "200": { description: "{ok, decision} — the provider team is notified; the trip's consentObtained flips when every child has granted" }
        "404": { description: Child not owned by the caller, or not on this trip }

  /api/shifts:
    get:
      tags: [shifts]
      summary: The rota (staff read too); window with from/to
      parameters:
        - { name: from, in: query, required: false, schema: { type: string }, description: "ISO date, inclusive" }
        - { name: to, in: query, required: false, schema: { type: string }, description: "ISO date, inclusive" }
      responses:
        "200": { description: Array of shifts, sorted by date then start }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [shifts]
      summary: Add a shift (operators only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staffName, date, start, end]
              properties:
                staffName: { type: string }
                staffId: { type: string }
                date: { type: string, description: "ISO date" }
                start: { type: string, description: "HH:MM" }
                end: { type: string, description: "HH:MM" }
                role: { type: string }
                listingId: { type: string }
                notes: { type: string }
      responses:
        "201": { description: The created shift }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Blocked by Settings → Staff & workforce: requireDBS (missing/expired DBS) or requireCompliance (expired first aid / safeguarding cert). Only enforced once the certifications register has entries." }

  /api/shifts/{id}:
    put:
      tags: [shifts]
      summary: Edit a shift (operators only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: The updated shift }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [shifts]
      summary: Delete a shift (operators only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ok:true}" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/payments/connect:
    post:
      tags: [payments]
      summary: Connect (or resume) the tenant's Stripe Express account
      responses:
        "200":
          description: The Stripe-hosted onboarding URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  accountId: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Payments not configured on the server

  /api/payments/status:
    get:
      tags: [payments]
      summary: How connected the tenant's Stripe account is
      responses:
        "200":
          description: Connection state
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected: { type: boolean }
                  accountId: { type: string }
                  chargesEnabled: { type: boolean }
                  detailsSubmitted: { type: boolean }
                  payoutsEnabled: { type: boolean }
                  platformFallback: { type: boolean, description: DEV flag — see the v0.9.0 notes }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/payments:
    get:
      tags: [payments]
      summary: The tenant's payment & refund records (oversight)
      parameters:
        - name: tenantId
          in: query
          required: false
          description: Platform accounts only
          schema: { type: string }
      responses:
        "200":
          description: Records, newest first (refunds have type "refund")
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/payments/checkout:
    post:
      tags: [payments]
      summary: Start paying for bookings (parent)
      description: |
        One PaymentIntent for the given bookings (all one provider, all
        payable — status `Confirmed` or `pay: "Invoice sent"`), created as a
        direct charge on the provider's connected account. Initialise
        Stripe.js with the returned `stripeAccount` before mounting the
        Payment Element.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refs]
              properties:
                refs:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: Client secret for the Payment Element
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentId: { type: string }
                  clientSecret: { type: string }
                  stripeAccount: { type: string, nullable: true }
                  amount: { type: number }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Not payable (already paid, not confirmed, or the provider hasn't finished Stripe onboarding)

  /api/payments/checkout/{id}/confirm:
    post:
      tags: [payments]
      summary: Verify the payment with Stripe and mark the bookings Paid
      description: Idempotent; only the paying family's account can call it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "{status, paid} — bookings flip to Paid when succeeded"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/geo/search:
    get:
      tags: [meta]
      summary: Geocode a UK postcode/address (server-side; OS when keyed)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, example: "MK14 6BN" }
      responses:
        "200":
          description: "[{label, lat, lng}] — Ordnance Survey Names, Nominatim fallback"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/geo/tiles/{z}/{x}/{y}:
    get:
      tags: [meta]
      summary: Map tile (public; OS Maps proxied so the key stays server-side)
      security: []
      parameters:
        - { name: z, in: path, required: true, schema: { type: integer } }
        - { name: x, in: path, required: true, schema: { type: integer } }
        - { name: y, in: path, required: true, schema: { type: string, description: "tile Y, .png suffix ok" } }
      responses:
        "200": { description: PNG tile (week-cached, immutable) }

  /api/moments:
    get:
      tags: [moments]
      summary: Moments — parent's own child's (role parent) or the tenant's (operators)
      parameters:
        - { name: date, in: query, required: false, schema: { type: string } }
        - { name: childId, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: Moments, newest first }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [moments]
      summary: Share a moment (operators + staff)
      description: Children can only be tagged if their record has photoConsent — 409 otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoUrl]
              properties:
                photoUrl: { type: string, description: URL from POST /api/uploads }
                caption: { type: string }
                childIds: { type: array, items: { type: string } }
      responses:
        "201": { description: The moment }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: A tagged child has no photo consent }

  /api/moments/taggable:
    get:
      tags: [moments]
      summary: The day's booked children WITH photo consent (for the tag picker)
      parameters: [{ name: date, in: query, required: false, schema: { type: string } }]
      responses:
        "200": { description: "[{childId, name}]" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/moments/{id}:
    put:
      tags: [moments]
      summary: Edit caption/tags (operator or poster; re-checks consent)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Updated }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: A tagged child has no photo consent }
    delete:
      tags: [moments]
      summary: Delete a moment (operators only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/meals:
    get:
      tags: [meals]
      summary: The day's menu + dietary board
      parameters:
        - { name: date, in: query, required: false, schema: { type: string } }
        - { name: tenantId, in: query, required: false, description: Platform only, schema: { type: string } }
      responses:
        "200": { description: "{date, menu, allergens, sessions[] (children with allergies/dietary + alerts), summary}" }
        "403": { $ref: "#/components/responses/Forbidden" }
    # (see /api/meals/{date} for setting the menu)

  /api/meals/{date}:
    put:
      tags: [meals]
      summary: Set the day's menu (operators)
      parameters: [{ name: date, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meals]
              properties:
                meals:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      type: { type: string }
                      description: { type: string }
                      allergens: { type: array, items: { type: string } }
      responses:
        "200": { description: Saved }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/medications:
    get:
      tags: [medication]
      summary: Authorised medications — operator/staff (tenant's) or parent (own children's)
      parameters:
        - { name: childId, in: query, required: false, schema: { type: string } }
        - { name: includeArchived, in: query, required: false, schema: { type: string, enum: ["1"] } }
        - { name: tenantId, in: query, required: false, description: Platform only, schema: { type: string } }
      responses:
        "200": { description: Medications }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [medication]
      summary: Authorise a medication (staff + operators)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [childName, name, dose]
              properties:
                childName: { type: string }
                childId: { type: string }
                name: { type: string }
                dose: { type: string }
                condition: { type: string }
                schedule: { type: string }
                asNeeded: { type: boolean }
                storage: { type: string }
                heldOnSite: { type: boolean }
                expiryDate: { type: string }
                consentBy: { type: string }
                consentDate: { type: string }
                consentGranted: { type: boolean }
      responses:
        "201": { description: The authorised medication }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/medications/authorise:
    post:
      tags: [medication]
      summary: A parent authorises (consents to) a medication for their child
      description: >
        Creates the medication already consented (consentGranted:true, consentBy
        = the parent, source:"parent"). Gated: the child must be on the parent's
        account and they must have booked the provider. Flows into the operator's
        administer path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, childId, childName, name, dose]
              properties:
                tenantId: { type: string }
                childId: { type: string }
                childName: { type: string }
                name: { type: string }
                dose: { type: string }
                route: { type: string }
                condition: { type: string }
                schedule: { type: string }
                asNeeded: { type: boolean }
                storage: { type: string }
                startDate: { type: string }
                endDate: { type: string }
                notes: { type: string }
      responses:
        "201": { description: The authorised (consented) medication }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/medications/{id}/withdraw:
    post:
      tags: [medication]
      summary: A parent withdraws consent (archives; record kept, no more doses)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ok:true}" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/medications/administrations:
    get:
      tags: [medication]
      summary: "The MAR — every dose given (operator sees the tenant's, a parent their own children's)"
      parameters:
        - { name: date, in: query, required: false, schema: { type: string } }
        - { name: childId, in: query, required: false, schema: { type: string } }
        - { name: medicationId, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: Administration events, newest first }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/medications/{id}:
    put:
      tags: [medication]
      summary: Edit or archive a medication
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Updated }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [medication]
      summary: Delete a medication (operators; 409 if it has a dose history)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Has a dose history — archive instead }

  /api/medications/{id}/administer:
    post:
      tags: [medication]
      summary: Record a dose given (gated on parental consent)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, doseGiven]
              properties:
                date: { type: string }
                time: { type: string }
                doseGiven: { type: string }
                witnessedBy: { type: string }
                notes: { type: string }
      responses:
        "201": { description: The MAR entry }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: No consent on file, or archived }

  /api/incidents:
    get:
      tags: [incidents]
      summary: The safeguarding log — operator/staff (tenant's) or parent (own children's, read-only)
      parameters:
        - { name: kind, in: query, required: false, schema: { type: string, enum: [accident, incident] } }
        - { name: childId, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string } }
        - { name: to, in: query, required: false, schema: { type: string } }
        - { name: tenantId, in: query, required: false, description: Platform only, schema: { type: string } }
      responses:
        "200": { description: Records, newest first }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [incidents]
      summary: Record an accident or incident (staff + operators)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, date, childName, description]
              properties:
                kind: { type: string, enum: [accident, incident] }
                date: { type: string }
                time: { type: string }
                childName: { type: string }
                childId: { type: string }
                location: { type: string }
                description: { type: string }
                injury: { type: string }
                treatment: { type: string }
                firstAider: { type: string }
                incidentType: { type: string }
                actionTaken: { type: string }
                witnesses: { type: string }
                severity: { type: string, enum: [minor, moderate, serious] }
                parentNotified: { type: boolean }
      responses:
        "201": { description: The created record }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/incidents/{id}:
    put:
      tags: [incidents]
      summary: Edit a record (provider or the recorder)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Updated }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [incidents]
      summary: Delete a record (operators only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/ratios:
    get:
      tags: [ratios]
      summary: The day's sessions with staffing ratios and groups
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, example: "2026-08-03" }
        - name: tenantId
          in: query
          required: false
          description: Platform accounts only
          schema: { type: string }
      responses:
        "200":
          description: "{date, bands, sessions[]} — each session: children, requiredStaff, staffAssigned, met, groups"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/ratios/board/{date}:
    get:
      tags: [ratios]
      summary: The day's cover board (drag overrides + per-group staffing)
      description: One board per tenant per day — the state the Ratios cover board renders. Staff and operators.
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string, example: "2026-08-03" }
      responses:
        "200": { description: "{overrides: {childKey: groupId}, groupStaff: {groupId: staffIds[]}}" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [ratios]
      summary: Save the day's cover board (staff + operators)
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                overrides:
                  type: object
                  description: childKey → groupId (a manual drag out of the age-derived group)
                groupStaff:
                  type: object
                  description: groupId → array of staff ids covering it
      responses:
        "200": { description: Saved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/ratios/{blockId}/{date}:
    put:
      tags: [ratios]
      summary: Save a session's groups + staffing (operators)
      parameters:
        - name: blockId
          in: path
          required: true
          schema: { type: string }
        - name: date
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groups]
              properties:
                groups:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      childIds: { type: array, items: { type: string } }
                      staffIds: { type: array, items: { type: string } }
      responses:
        "200": { description: Saved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/registers:
    get:
      tags: [registers]
      summary: The day's registers (default today)
      description: |
        Every session the caller's tenant runs on the date — one entry per
        block with a session that day — with expected attendees (bookings
        holding a place) merged with the attendance taken so far. Staff can
        read. Platform must pass `?tenantId=`. Parents 403.
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, example: "2026-08-03" }
        - name: tenantId
          in: query
          required: false
          description: Platform accounts only
          schema: { type: string }
      responses:
        "200":
          description: Sessions ordered by start time
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RegisterSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/registers/{blockId}/{date}/mark:
    post:
      tags: [registers]
      summary: Check a child in/out, mark absent, or undo
      description: |
        The `staff` role's one write (operators can too; platform and parents
        cannot). `in` stamps the arrival time; `out` stamps departure and
        keeps the arrival; `absent` records a no-show; `expected` clears the
        entry (mis-tap undo). The booking must hold a place on the block
        (Confirmed / Approval needed) — anything else is a 409.
      parameters:
        - name: blockId
          in: path
          required: true
          schema: { type: string }
        - name: date
          in: path
          required: true
          schema: { type: string, example: "2026-08-03" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref, status]
              properties:
                ref: { type: string, example: "10312" }
                status: { type: string, enum: [in, out, absent, expected] }
      responses:
        "200":
          description: The updated entry (null after an undo)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ref: { type: string }
                  attendance:
                    $ref: "#/components/schemas/AttendanceEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The booking doesn't hold a place on this block

  /api/periods:
    get:
      tags: [blocks-builder]
      summary: My tenant's periods (platform — ?tenantId=)
      responses:
        "200":
          description: Periods sorted by start time
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Period" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [blocks-builder]
      summary: Create a period
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PeriodInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Period" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/periods/{id}:
    put:
      tags: [blocks-builder]
      summary: Update a period
